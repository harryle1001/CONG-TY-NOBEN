<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="graph" aria-label="Đồ thị kiến thức"></canvas>

<header class="top">
  <div class="brand">J.A.R.V.I.S.</div>
  <div class="badges">
    <span id="b-mode" class="badge">…</span>
    <span id="b-stats" class="badge dim">…</span>
    <span id="b-model" class="badge dim">…</span>
    <span id="b-voice" class="badge dim">…</span>
  </div>
</header>

<aside class="panel left">
  <section id="inspector">
    <h2>INSPECTOR</h2>
    <div id="insp-body" class="empty">Bấm một node để xem nội dung. Shift-bấm node thứ hai để tìm đường ngắn nhất.</div>
  </section>
  <section>
    <h2>TOP HUBS</h2>
    <ol id="hubs"></ol>
  </section>
</aside>

<aside class="panel right">
  <section class="reactor-wrap">
    <div id="reactor" class="reactor idle" aria-label="Trạng thái">
      <i></i><i></i><i></i><b></b>
    </div>
    <div id="state" class="state">IDLE</div>
    <div id="bars" class="bars" aria-hidden="true"></div>
  </section>
  <section>
    <h2>FILTER <button id="f-all" class="link">tất cả</button></h2>
    <ul id="filters"></ul>
  </section>
</aside>

<footer class="ask">
  <div id="caption" class="caption" hidden></div>
  <div id="reply" class="reply" hidden></div>
  <form id="ask-form" autocomplete="off">
    <input id="ask" type="text" spellcheck="false" aria-label="Hỏi Jarvis">
    <button type="submit" class="go" aria-label="Gửi">↵</button>
  </form>
  <nav class="tools">
    <button id="t-mic" disabled title="Bấm một lần rồi cứ nói. Space/Esc: ngắt lời Jarvis">MIC</button>
    <button id="t-mute" disabled title="Tắt/bật giọng Jarvis">MUTE</button>
    <button id="t-brief" title="Lịch, thư chưa đọc, việc trễ hạn">BRIEF</button>
    <button id="t-plan" title="Tối đa 5 việc, ưu tiên việc ra tiền">PLAN</button>
    <button id="t-inbox" title="Hộp thư (chỉ đọc)">INBOX</button>
    <button id="t-memory" title="Những gì Jarvis đã ghi nhớ">MEMORY</button>
  </nav>
</footer>

<div id="error" class="error" hidden></div>
<script src="graph.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
