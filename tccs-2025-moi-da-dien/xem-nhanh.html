const tb=document.getElementById('tb'),q=document.getElementById('q'),f1=document.getElementById('f1'),cnt=document.getElementById('cnt');
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function draw(){
 const k=q.value.trim().toLowerCase(),fb=f1.getAttribute('aria-pressed')==='true';
 let h='',last='',n=0,tot=0;
 for(const r of R){
  if(fb&&!r.i.some(x=>x[2]))continue;
  const txt=(r.p+' '+r.i.map(x=>x[0]+' '+x[1]).join(' ')).toLowerCase();
  if(k&&!txt.includes(k))continue;
  if(r.g!==last){last=r.g;h+='<tr class="grp"><td colspan="3">'+(r.g==='TABS'?'42 TCCS thức ăn bổ sung':'58 TCCS xử lý môi trường')+'</td></tr>'}
  const chips=r.i.map(x=>'<span class="c">'+esc(x[0])+' <small>'+esc(x[1])+(x[2]?' *':'')+'</small></span>').join('')+r.m.map(x=>'<span class="e">'+esc(x)+': trống</span>').join('');
  h+='<tr><td class="n">'+r.n+'</td><td class="p">'+esc(r.p)+(r.new?' <span class="z">(mới, không có bản cũ)</span>':'')+'</td><td>'+(chips||'<span class="z">Không có chỉ tiêu cần điền</span>')+'</td></tr>';
  n++;tot+=r.i.length;
 }
 tb.innerHTML=h;cnt.textContent=n+' sản phẩm, '+tot+' mục đã sửa';
}
q.addEventListener('input',draw);
f1.addEventListener('click',()=>{f1.setAttribute('aria-pressed',f1.getAttribute('aria-pressed')==='true'?'false':'true');draw()});
draw();
