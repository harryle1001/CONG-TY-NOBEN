<script>
const P=[{"stt":1,"ngay":"2026-11-20","thu":"Thứ Sáu","tru_cot":"Chuẩn hóa · Tổng quan","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa doanh nghiệp bắt đầu từ đâu: bản đồ 6 mảng (bán hàng, chăm sóc khách, báo cáo, sổ sách, kế hoạch, nhận diện & website) và cách tự chấm điểm từng mảng trong 30 phút","tieu_de":"Chuẩn hóa doanh nghiệp bắt đầu từ đâu? Bản đồ 6 mảng trong 30 phút","demo":"Video mở đầu chuỗi: các mẫu concept của Dream Labs (demo AI mô phỏng, website Ombrève, bao bì Khuê Lam xoay 360, motion Talvère, video Lam Kỳ)","loai_media":"video","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p01/video.mp4","anh_bia":"media/p01/cover.jpg","carousel":["media/p01/slide-1.jpg","media/p01/slide-2.jpg","media/p01/slide-3.jpg","media/p01/slide-4.jpg","media/p01/slide-5.jpg","media/p01/slide-6.jpg","media/p01/slide-7.jpg","media/p01/slide-8.jpg","media/p01/slide-9.jpg","media/p01/slide-10.jpg","media/p01/slide-11.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Chuẩn hóa doanh nghiệp: bắt đầu từ mảng nào trước?\n\nĐây là câu hỏi rất hay gặp ở doanh nghiệp nhỏ. Mọi thứ vẫn \"chạy được\", nhưng chạy nhờ trí nhớ của vài người. Một người nghỉ phép là đơn chậm, báo cáo trễ, tin nhắn khách không ai trả lời.\n\nChuẩn hóa không bắt đầu bằng việc mua phần mềm. Nó bắt đầu bằng một tấm bản đồ: doanh nghiệp đang có những mảng nào, mảng nào đã ổn, mảng nào đang tốn sức nhất. Bài này hướng dẫn anh chị tự vẽ tấm bản đồ đó trong khoảng 30 phút, chỉ cần một bảng tính hoặc một tờ giấy A4.\n\n▸ 6 MẢNG CẦN NHÌN\n1. Bán hàng: từ lúc có khách mới đến lúc chốt đơn.\n2. Chăm sóc khách: trả lời tin nhắn, hỗ trợ sau bán, xử lý khiếu nại.\n3. Báo cáo: số liệu ngày, tuần, tháng; ai đọc và đọc để quyết định gì.\n4. Sổ sách: thu chi, hóa đơn, công nợ, đối chiếu cuối kỳ.\n5. Kế hoạch: mục tiêu tháng, quý; phân việc; theo dõi tiến độ.\n6. Nhận diện & website: logo, bao bì, website, trang mạng xã hội có thống nhất và còn đúng thông tin không.\n\n▸ 6 BƯỚC TỰ CHẤM ĐIỂM TRONG 30 PHÚT\n1. Vẽ bản đồ (5 phút). Kẻ một bảng 6 dòng ứng với 6 mảng. Mỗi dòng ghi ai đang phụ trách và đang làm bằng công cụ gì: sổ tay, bảng tính, nhóm chat nội bộ hay phần mềm.\n2. Chấm điểm 0–3 cho từng mảng (10 phút). 0 = chưa có gì. 1 = mỗi người làm theo thói quen riêng. 2 = có quy trình viết ra nhưng vẫn làm tay. 3 = có quy trình, có số đo, chạy đều kể cả khi người phụ trách vắng.\n3. Kiểm tra lại bằng 3 câu hỏi (5 phút). Với mỗi mảng hỏi: người khác làm thay được không? Có tài liệu viết ra không? Có con số theo dõi mỗi tuần không? Mỗi câu \"không\" thì hạ 1 điểm so với điểm anh chị vừa tự chấm.\n4. Ước giờ làm tay mỗi tuần (5 phút). Ghi việc lặp lại lớn nhất của từng mảng và số giờ nó chiếm. Công thức: phút mỗi ngày × số ngày làm ÷ 60. Ví dụ: trả lời tin nhắn hỏi giá 60 phút/ngày × 6 ngày ÷ 60 = 6 giờ/tuần.\n5. Chọn đúng 1 mảng ưu tiên (3 phút). Lấy mảng điểm thấp mà tốn nhiều giờ nhất. Chỉ một mảng cho 30 ngày tới, các mảng còn lại đưa vào danh sách chờ.\n6. Hẹn ngày chấm lại (2 phút). Đặt lịch sau 30 ngày, chấm lại bằng đúng bảng này. Điểm tăng là tiến thật, không tăng thì xem lại cách làm.\n\n▸ MẪU BẢNG CHÉP DÙNG NGAY\nMảng | Người phụ trách | Đang làm bằng gì | Điểm 0–3 | Giờ làm tay/tuần | Ghi chú\nBán hàng | ___ | ___ | ___ | ___ | ___\nChăm sóc khách | ___ | ___ | ___ | ___ | ___\nBáo cáo | ___ | ___ | ___ | ___ | ___\nSổ sách | ___ | ___ | ___ | ___ | ___\nKế hoạch | ___ | ___ | ___ | ___ | ___\nNhận diện & website | ___ | ___ | ___ | ___ | ___\n\nDòng cuối ghi: Mảng ưu tiên: ___ · Người chịu trách nhiệm: ___ · Ngày chấm lại: ___\n\n▸ 3 LỖI HAY GẶP\n• Muốn chuẩn hóa cả 6 mảng cùng lúc. Sau một tháng, mảng nào cũng dở dang.\n• Chủ doanh nghiệp tự chấm theo cảm giác, không hỏi người trực tiếp làm việc đó hằng ngày.\n• Mua phần mềm trước khi biết quy trình đang chạy thế nào, rồi phần mềm thành thêm một nơi phải nhập liệu.\n\n▸ VÌ SAO ĐI THEO THỨ TỰ NÀY\nKhi đã có bản đồ, anh chị sẽ thấy rõ việc nào cần viết lại quy trình, việc nào giao cho máy làm được, và việc nào chỉ cần sửa giao diện như website hay bao bì. Các bài tiếp theo trong chuỗi \"Chuẩn hóa doanh nghiệp\" sẽ đi sâu từng mảng một, mỗi bài kèm mẫu chép dùng ngay.\n\n▸ VIDEO MỞ ĐẦU CHUỖI\nVideo đi kèm lướt qua các mẫu concept do Dream Labs thiết kế, ứng với từng mảng trong bản đồ: demo AI mô phỏng cho bán hàng, chăm sóc khách và báo cáo (số liệu minh họa); website Ombrève; bao bì Khuê Lam xoay 360; phim motion Talvère; video Lam Kỳ. Các thương hiệu trong video là mẫu concept, không phải khách hàng.\n\n▸ NẾU MUỐN CÓ NGƯỜI CÙNG NHÌN\nChấm xong mà vẫn phân vân nên bắt đầu từ mảng nào, anh chị gửi bảng điểm qua Zalo 0934 246 420. Dream Labs có buổi tư vấn 30 phút miễn phí để cùng anh chị chọn mảng đầu tiên, không bắt buộc dùng dịch vụ. Xem thêm tại dreamlabs.vn.","media":["media/p01/video.mp4"],"media_phu":["media/p01/slide-1.jpg","media/p01/slide-2.jpg","media/p01/slide-3.jpg","media/p01/slide-4.jpg","media/p01/slide-5.jpg","media/p01/slide-6.jpg","media/p01/slide-7.jpg","media/p01/slide-8.jpg","media/p01/slide-9.jpg","media/p01/slide-10.jpg","media/p01/slide-11.jpg"]},"instagram":{"caption":"Chuẩn hóa doanh nghiệp nên bắt đầu từ đâu? Từ một tấm bản đồ, không phải từ phần mềm.\n\nLướt carousel để xem từng bước tự chấm điểm 6 mảng trong khoảng 30 phút:\n1. Vẽ bản đồ 6 mảng: bán hàng, chăm sóc khách, báo cáo, sổ sách, kế hoạch, nhận diện & website.\n2. Chấm điểm 0–3 cho từng mảng.\n3. Kiểm tra lại bằng 3 câu hỏi: người khác làm thay được không, có tài liệu không, có số đo hằng tuần không.\n4. Ước giờ làm tay mỗi tuần: phút/ngày × số ngày ÷ 60.\n5. Chọn đúng 1 mảng ưu tiên cho 30 ngày.\n6. Hẹn ngày chấm lại bằng chính bảng đó.\n\nLỗi hay gặp nhất: muốn sửa cả 6 mảng cùng lúc, cuối cùng mảng nào cũng dở dang.\n\nLưu bài này lại và chép mẫu bảng ở slide cuối để dùng ngay. Video mở đầu chuỗi là các mẫu concept do Dream Labs thiết kế, demo AI là demo mô phỏng với số liệu minh họa.\n\nCần người cùng nhìn bảng điểm? Tư vấn 30 phút miễn phí qua Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#chuanhoadoanhnghiep","#quytrinhdoanhnghiep","#quantridoanhnghiep","#doanhnghiepnho","#chudoanhnghiep","#tudonghoa","#tudonghoaquytrinh","#kinhdoanh","#smallbusiness","#SOP"],"media":["media/p01/slide-1.jpg","media/p01/slide-2.jpg","media/p01/slide-3.jpg","media/p01/slide-4.jpg","media/p01/slide-5.jpg","media/p01/slide-6.jpg","media/p01/slide-7.jpg","media/p01/slide-8.jpg","media/p01/slide-9.jpg","media/p01/slide-10.jpg","media/p01/slide-11.jpg"],"reels":"media/p01/video.mp4"},"tiktok":{"caption":"Chuẩn hóa doanh nghiệp bắt đầu từ đâu? Tự chấm 6 mảng trong 30 phút, chọn đúng 1 mảng làm trước.","hashtags":["#chuanhoadoanhnghiep","#doanhnghiepnho","#quantri","#dreamlabs"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"Muốn chuẩn hóa nhưng không biết bắt đầu?","voice":"Muốn chuẩn hóa doanh nghiệp mà không biết bắt đầu từ đâu?"},{"t":"3–7s","screen":"Bước 1: Vẽ bản đồ 6 mảng","voice":"Kẻ một bảng sáu dòng: bán hàng, chăm sóc khách, báo cáo, sổ sách, kế hoạch, website."},{"t":"7–11s","screen":"Bước 2: Chấm điểm 0 đến 3","voice":"Chấm mỗi mảng từ không đến ba, hỏi luôn người đang làm việc đó."},{"t":"11–15s","screen":"Bước 3: Ba câu hỏi kiểm tra","voice":"Người khác làm thay được không, có tài liệu không, có số đo không?"},{"t":"15–19s","screen":"Bước 4: Phút/ngày × ngày ÷ 60","voice":"Ước số giờ làm tay mỗi tuần của việc lặp lại lớn nhất."},{"t":"19–23s","screen":"Bước 5: Chọn đúng 1 mảng","voice":"Chọn mảng điểm thấp mà tốn giờ nhất, chỉ một mảng thôi."},{"t":"23–27s","screen":"Bước 6: Chấm lại sau 30 ngày","voice":"Hẹn ngày chấm lại bằng đúng bảng này để biết mình tiến thật chưa."},{"t":"27–32s","screen":"Mẫu concept · demo mô phỏng","voice":"Các hình bạn vừa thấy là mẫu concept và demo mô phỏng do Dream Labs làm."},{"t":"32–36s","screen":"Tư vấn 30 phút miễn phí · Zalo 0934 246 420","voice":"Cần người cùng nhìn bảng điểm, nhắn Zalo cho Dream Labs nhé."}],"media":["media/p01/video.mp4"]},"x":{"tweet":"Chuẩn hóa doanh nghiệp nên bắt đầu từ một tấm bản đồ, không phải phần mềm. Chấm 0–3 cho 6 mảng: bán hàng, chăm sóc khách, báo cáo, sổ sách, kế hoạch, website. Chọn mảng điểm thấp mà tốn giờ nhất, làm 30 ngày rồi chấm lại. dreamlabs.vn","thread":["Muốn chuẩn hóa doanh nghiệp mà không biết bắt đầu từ đâu? Dành 30 phút làm tấm bản đồ 6 mảng này trước khi mua bất kỳ phần mềm nào.","1/ Kẻ bảng 6 dòng: bán hàng, chăm sóc khách, báo cáo, sổ sách, kế hoạch, nhận diện & website. Ghi người phụ trách và công cụ đang dùng.","2/ Chấm 0–3: 0 chưa có, 1 mỗi người một kiểu, 2 có quy trình nhưng làm tay, 3 có quy trình + số đo, chạy đều khi vắng người. Mỗi câu \"không\" ở 3 câu kiểm tra (làm thay được? có tài liệu? có số đo?) hạ 1 điểm.","3/ Ước giờ làm tay: phút/ngày × ngày ÷ 60. Ví dụ 60 phút/ngày × 6 ngày = 6 giờ/tuần. Chọn đúng 1 mảng điểm thấp mà tốn giờ nhất cho 30 ngày tới.","4/ Hẹn chấm lại sau 30 ngày bằng chính bảng đó. Cần người cùng nhìn bảng điểm? Dream Labs tư vấn 30 phút miễn phí, Zalo 0934 246 420. dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p01/video.mp4"]},"zalo_oa":{"tieu_de":"Chuẩn hóa doanh nghiệp: bắt đầu từ mảng nào?","noi_dung":"Trước khi mua phần mềm, anh chị dành 30 phút chấm điểm 0–3 cho 6 mảng: bán hàng, chăm sóc khách, báo cáo, sổ sách, kế hoạch, nhận diện & website. Hỏi thêm 3 câu: người khác làm thay được không, có tài liệu không, có số đo không. Chọn mảng điểm thấp mà tốn giờ nhất để làm trước. Gửi bảng điểm cho Dream Labs để được tư vấn 30 phút miễn phí.","nut":{"nhan":"Đặt lịch tư vấn","link":"https://dreamlabs.vn/#lien-he"},"anh":"media/p01/cover.jpg"},"ghi_chu":"Nhạc: chọn khi duyệt bài. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":2,"ngay":"2026-11-21","thu":"Thứ Bảy","tru_cot":"Chuẩn hóa · Chăm sóc khách","uu_tien_zalo":true,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa tiếp nhận tin nhắn khách: gom mọi kênh về một nơi, bộ câu trả lời mẫu, nhãn phân loại, quy tắc chuyển người, trực ngoài giờ","tieu_de":"Gom tin nhắn khách về một nơi: 6 bước chuẩn hóa tiếp nhận","demo":"Video demo mô phỏng trợ lý AI trên Zalo OA trả lời lúc 23:04 và ghi khách vào Google Sheets","loai_media":"video","gio_dang":{"facebook":"09:30","instagram":"10:30","tiktok":"19:30","zalo_oa":"09:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p02/video.mp4","anh_bia":"media/p02/cover.jpg","carousel":["media/p02/slide-1.jpg","media/p02/slide-2.jpg","media/p02/slide-3.jpg","media/p02/slide-4.jpg","media/p02/slide-5.jpg","media/p02/slide-6.jpg","media/p02/slide-7.jpg","media/p02/slide-8.jpg","media/p02/slide-9.jpg","media/p02/slide-10.jpg","media/p02/slide-11.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Khách nhắn lúc 23:04, sáng hôm sau mới có người đọc. Quen không?\n\nTin nhắn khách thường đến từ năm, sáu chỗ: Zalo OA, Messenger, Zalo cá nhân của nhân viên, bình luận Facebook và TikTok, form trên website, điện thoại. Mỗi người đọc một kênh, mỗi người trả lời một kiểu, và không có nơi nào ghi lại đầy đủ ai đã hỏi gì. Hậu quả là khách bị bỏ sót, câu trả lời giá mỗi người một số, còn chủ doanh nghiệp không biết mỗi ngày thật ra có bao nhiêu người hỏi.\n\nChuẩn hóa tiếp nhận tin nhắn không cần đổi hết công cụ. Chỉ cần sáu bước dưới đây, làm dần trong một tuần.\n\n▸ 6 BƯỚC CHUẨN HÓA TIẾP NHẬN TIN NHẮN\n1. Liệt kê mọi kênh khách đang nhắn. Ghi rõ kênh nào, ai đọc, đọc giờ nào, mỗi ngày khoảng bao nhiêu tin, có ghi lại không. Kênh nào không ai chịu trách nhiệm thì đóng lại hoặc đặt tin tự động chỉ về kênh chính.\n2. Gom về một nơi ghi nhận duy nhất. Chọn một tab Google Sheets hoặc một phần mềm CRM. Mỗi khách nhắn mới là một dòng, dù đến từ kênh nào. Khách nhắn qua Zalo cá nhân của nhân viên cũng phải được ghi vào đây trong ngày.\n3. Viết bộ câu trả lời mẫu cho 10 câu hỏi hay gặp. Lọc tin nhắn hai tuần gần nhất, lấy 10 câu hay lặp lại nhất: giá, phí giao, thời gian giao, giờ mở cửa, đổi trả. Mỗi câu trả lời ngắn, đúng giọng thương hiệu, và kết thúc bằng một câu hỏi để giữ hội thoại.\n4. Gắn nhãn phân loại. Dùng tối đa năm nhãn để ai cũng gắn giống nhau: HỎI GIÁ, ĐẶT HÀNG, KHIẾU NẠI, SAU BÁN, KHÁC. Mỗi tin chỉ một nhãn. Nhãn là thứ giúp anh chị cuối tuần đếm được mình đang nhận loại tin nào nhiều.\n5. Đặt quy tắc chuyển người. Viết ra khi nào trợ lý hoặc nhân viên trực phải chuyển cho người có quyền: khiếu nại, xin giảm giá ngoài bảng, đơn lớn, khách hỏi đến lần thứ hai vẫn chưa được giải quyết. Kèm thời gian phản hồi tối đa cho từng trường hợp.\n6. Trực ngoài giờ. Soạn tin tự động cho ngoài giờ: cảm ơn, báo giờ làm việc, xin trước hai, ba thông tin, hẹn giờ gọi lại cụ thể. Sáng hôm sau, tin đêm trước được xử lý đầu tiên.\n\n▸ MẪU CHÉP DÙNG NGAY\nBảng ghi nhận khách:\nNgày giờ | Kênh | Tên | SĐT | Nhu cầu | Nhãn | Người xử lý | Trạng thái\n\nCâu trả lời mẫu:\nCâu hỏi: ___ | Trả lời chuẩn: ___ | Câu hỏi tiếp theo: \"Anh/chị cần cho mấy người, dùng khi nào ạ?\" | Ngày cập nhật: ___\n\nQuy tắc chuyển người:\nKHIẾU NẠI → quản lý, trong 15 phút\nGiảm giá ngoài bảng → chủ doanh nghiệp\nĐơn trên ___đ → trưởng bán hàng\nHỏi lần 2 chưa xong → người phụ trách ca\n\nTin ngoài giờ:\n\"Dạ cảm ơn anh/chị đã nhắn [tên cửa hàng]. Bên em làm việc 8:00–18:00. Anh/chị cho em xin tên, số điện thoại và nhu cầu, 8:30 sáng mai em gọi lại ạ.\"\n\n▸ 3 LỖI HAY GẶP\n• Nhân viên dùng Zalo cá nhân để chốt khách. Người nghỉ việc là mất luôn lịch sử khách.\n• Câu trả lời mẫu quá dài, đọc như văn bản hành chính, khách đọc xong vẫn phải hỏi lại.\n• Không có quy tắc chuyển người, nên khiếu nại cũng bị trả lời bằng tin mẫu.\n\n▸ KHI ĐÃ CHUẨN, MÁY MỚI LÀM THAY ĐƯỢC\nSáu bước trên làm bằng tay vẫn hiệu quả. Nhưng khi bộ câu trả lời mẫu, nhãn và quy tắc chuyển người đã rõ, đó cũng chính là \"tài liệu huấn luyện\" để một trợ lý AI trực thay ngoài giờ.\n\nVideo đi kèm là demo mô phỏng (số liệu minh họa) do Dream Labs dựng: khách nhắn Zalo OA lúc 23:04, trợ lý AI trả lời theo bộ câu mẫu, hỏi đủ thông tin, gắn nhãn và ghi khách thành một dòng mới trong Google Sheets. Sáng hôm sau, người phụ trách chỉ cần mở bảng và gọi lại. Nó minh họa đúng bước 2 và bước 6.\n\n▸ BẮT ĐẦU NHỎ\nNếu anh chị muốn dựng phần này cho một kênh trước, gói Khởi động của Dream Labs gồm một quy trình tiếp nhận và phân loại khách, trợ lý AI trên Zalo OA/Messenger, đồng bộ Google Sheets: 5.000.000đ (chưa gồm VAT), làm trong 5–7 ngày. Còn nếu chỉ muốn hỏi xem bộ câu mẫu của mình đã đủ chưa, nhắn Zalo 0934 246 420 để đặt buổi tư vấn 30 phút miễn phí.","media":["media/p02/video.mp4"],"media_phu":["media/p02/slide-1.jpg","media/p02/slide-2.jpg","media/p02/slide-3.jpg","media/p02/slide-4.jpg","media/p02/slide-5.jpg","media/p02/slide-6.jpg","media/p02/slide-7.jpg","media/p02/slide-8.jpg","media/p02/slide-9.jpg","media/p02/slide-10.jpg","media/p02/slide-11.jpg"]},"instagram":{"caption":"Khách nhắn lúc 23:04, sáng mai mới có người đọc. Vấn đề không nằm ở nhân viên, mà ở chỗ tin nhắn đang nằm rải rác ở năm, sáu kênh.\n\nLướt carousel để xem từng bước chuẩn hóa tiếp nhận tin nhắn:\n1. Liệt kê mọi kênh: ai đọc, giờ nào, mỗi ngày bao nhiêu tin.\n2. Gom về một nơi ghi nhận: một tab Google Sheets hoặc phần mềm CRM, mỗi khách một dòng.\n3. Viết câu trả lời mẫu cho 10 câu hỏi hay gặp, kết bằng một câu hỏi.\n4. Gắn tối đa 5 nhãn: Hỏi giá, Đặt hàng, Khiếu nại, Sau bán, Khác.\n5. Đặt quy tắc chuyển người cho khiếu nại, giảm giá, đơn lớn.\n6. Soạn tin ngoài giờ có hẹn giờ gọi lại cụ thể.\n\nLỗi hay gặp: nhân viên chốt khách bằng Zalo cá nhân, nghỉ việc là mất lịch sử khách.\n\nVideo là demo mô phỏng (số liệu minh họa): trợ lý AI trên Zalo OA trả lời lúc 23:04 và ghi khách vào Google Sheets.\n\nLưu bài để chép mẫu bảng g  nhật","tru_cot":"Chuẩn hóa · Quy trình","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Viết quy trình (SOP) cho một việc lặp lại trong 1 trang: chọn việc, quay/ghi lại cách làm, tách bước, đặt người chịu trách nhiệm và tiêu chí xong, chạy thử với người mới","tieu_de":"Viết quy trình SOP trong 1 trang: 6 bước làm được ngay","demo":"Ảnh demo mô phỏng 'svc-ai': luồng tự động hóa nối các công cụ; nhấn mạnh: SOP rõ thì mới tự động hóa được","loai_media":"carousel","gio_dang":{"facebook":"09:30","instagram":"10:30","tiktok":"19:30","zalo_oa":"09:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p03/slide-1.jpg","media/p03/slide-2.jpg","media/p03/slide-3.jpg","media/p03/slide-4.jpg","media/p03/slide-5.jpg","media/p03/slide-6.jpg","media/p03/slide-7.jpg","media/p03/slide-8.jpg","media/p03/slide-9.jpg","media/p03/slide-10.jpg","media/p03/slide-11.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"Người cũ nghỉ, việc dừng. Vì quy trình chỉ nằm trong đầu họ.\n\nHầu như doanh nghiệp nào cũng có vài việc lặp lại mỗi tuần mà chỉ một người làm \"chuẩn\": lên đơn, xuất hóa đơn, nhận hàng trả, đăng bài, gửi báo giá. Người đó nghỉ phép hay nghỉ việc, người thay phải hỏi lại từ đầu, và sai ở đúng những chỗ người cũ từng sai.\n\nCách gỡ là viết quy trình làm việc chuẩn, hay SOP, cho từng việc. Nhưng SOP dày 20 trang thì không ai đọc. Bài này hướng dẫn anh chị viết SOP cho một việc trong đúng một trang, làm được trong một buổi chiều.\n\n▸ 6 BƯỚC VIẾT SOP 1 TRANG\n1. Chọn một việc lặp lại. Ưu tiên việc làm ít nhất mỗi tuần một lần, có từ hai người trở lên làm, và hay sai hoặc hay bị hỏi lại. Đừng chọn việc lớn kiểu \"bán hàng\"; chọn việc cụ thể kiểu \"lên đơn hàng từ tin nhắn\".\n2. Quay hoặc ghi lại cách người giỏi nhất đang làm. Nhờ họ vừa làm vừa nói, quay màn hình hoặc quay bằng điện thoại. Lúc này chưa sửa gì, chỉ ghi đúng thực tế: bắt đầu từ đâu, mở công cụ gì, nhập gì, kiểm tra gì, gửi cho ai.\n3. Tách thành 5–10 bước, mỗi bước bắt đầu bằng một động từ: Mở, Nhập, Kiểm tra, Gửi, Lưu. Ghi đầu vào và đầu ra của từng bước. Chỗ nào cần quyết định thì viết dạng \"Nếu… thì…\" để người mới không phải đoán.\n4. Đặt người chịu trách nhiệm và tiêu chí xong. Mỗi SOP có một người chủ lo cập nhật tài liệu. Mỗi bước có người làm. Viết rõ \"xong là khi…\" bằng thứ kiểm tra được: đã ghi vào bảng, đã gửi, khách đã xác nhận. Thêm thời gian chuẩn cho cả việc.\n5. Gói vào một trang. Đầu trang: mục đích và khi nào dùng. Giữa trang: các bước. Cuối trang: lỗi hay gặp, cần hỏi ai, phiên bản và ngày cập nhật. Dài quá một trang nghĩa là anh chị đang gộp hai việc; tách thành hai SOP.\n6. Chạy thử với người mới. Đưa SOP cho một người chưa từng làm việc đó, để họ tự làm, anh chị chỉ quan sát và không nhắc. Chỗ nào họ dừng lại hỏi là chỗ SOP còn thiếu. Sửa ngay, tăng số phiên bản.\n\n▸ MẪU SOP 1 TRANG CHÉP DÙNG NGAY\nTên việc: ___\nMục đích: ___\nKhi nào dùng: ___\nChủ SOP: ___ · Người làm: ___\nThời gian chuẩn: ___ phút\n\nBước | Động từ + việc | Đầu vào | Đầu ra | Nếu… thì…\n1 | ___ | ___ | ___ | ___\n2 | ___ | ___ | ___ | ___\n3 | ___ | ___ | ___ | ___\n\nXong khi: ___\nLỗi hay gặp: ___\nCần hỏi: ___\nPhiên bản: v___ · Ngày cập nhật: ___\n\nBảng chạy thử: Người thử ___ · Hỏi lại ở bước ___ · Sai ở bước ___ · Đã sửa ___\n\n▸ 3 LỖI HAY GẶP\n• Viết theo cách \"nên làm\" thay vì cách đang làm thật, nên SOP không khớp thực tế ngay từ ngày đầu.\n• Bước quá chung như \"xử lý đơn\", người mới đọc xong vẫn không biết bắt đầu từ đâu.\n• Viết xong cất vào thư mục, không ai cập nhật khi công cụ hoặc giá thay đổi.\n\n▸ SOP RÕ THÌ MỚI TỰ ĐỘNG HÓA ĐƯỢC\nMột SOP tốt có các bước bắt đầu bằng động từ, có đầu vào, đầu ra và các nhánh \"Nếu… thì…\". Đó cũng chính là thứ máy cần để làm thay. Bước nào là \"Nhập dữ liệu từ tin nhắn vào bảng\" hay \"Gửi xác nhận cho khách\", bước đó thường giao cho máy được. Bước nào cần cảm nhận và quyết định, bước đó giữ lại cho người.\n\nẢnh đi kèm là demo mô phỏng do Dream Labs dựng: một luồng tự động hóa nối các công cụ với nhau, mỗi khối trong luồng ứng với một dòng trong bảng SOP ở bước 3 và bước 4. Không có SOP, luồng này không có gì để chạy theo.\n\n▸ MUỐN CÓ NGƯỜI ĐỌC THỬ SOP\nViết xong SOP đầu tiên, anh chị có thể gửi qua Zalo 0934 246 420. Trong buổi tư vấn 30 phút miễn phí, Dream Labs sẽ cùng anh chị xem bước nào nên giữ cho người, bước nào có thể giao cho máy. Xem thêm bài về tự động hóa quy trình trên dreamlabs.vn.","media":["media/p03/slide-1.jpg","media/p03/slide-2.jpg","media/p03/slide-3.jpg","media/p03/slide-4.jpg","media/p03/slide-5.jpg","media/p03/slide-6.jpg","media/p03/slide-7.jpg","media/p03/slide-8.jpg","media/p03/slide-9.jpg","media/p03/slide-10.jpg","media/p03/slide-11.jpg"],"media_phu":[]},"instagram":{"caption":"Người cũ nghỉ, việc dừng. Vì quy trình chỉ nằm trong đầu một người.\n\nLướt carousel để xem từng bước viết SOP cho một việc lặp lại, gói trong đúng 1 trang:\n1. Chọn một việc cụ thể: làm mỗi tuần, nhiều người làm, hay sai.\n2. Quay lại cách người giỏi nhất đang làm, chưa sửa gì.\n3. Tách 5–10 bước, mỗi bước bắt đầu bằng một động từ, có \"Nếu… thì…\".\n4. Đặt người chủ SOP và tiêu chí \"xong là khi…\".\n5. Gói vào 1 trang: mục đích, các bước, lỗi hay gặp, phiên bản.\n6. Chạy thử với người mới; chỗ họ hỏi là chỗ cần sửa.\n\nLỗi hay gặp: viết theo cách \"nên làm\" thay vì cách đang làm thật.\n\nSOP rõ thì mới tự động hóa được. Ảnh cuối là demo mô phỏng do Dream Labs dựng: luồng tự động hóa nối các công cụ, mỗi khối ứng với một bước trong SOP.\n\nLưu bài để chép mẫu SOP 1 trang. Gửi SOP đầu tiên để được xem thử trong buổi tư vấn 30 phút miễn phí qua Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#chuanhoadoanhnghiep","#SOP","#quytrinhchuan","#quytrinhdoanhnghiep","#quantridoanhnghiep","#doanhnghiepnho","#chudoanhnghiep","#tudonghoa","#tudonghoaquytrinh","#smallbusiness"],"media":["media/p03/slide-1.jpg","media/p03/slide-2.jpg","media/p03/slide-3.jpg","media/p03/slide-4.jpg", ong là khi…\", rồi cho người mới chạy thử. dreamlabs.vn","thread":["Người cũ nghỉ là việc dừng, vì quy trình chỉ nằm trong đầu họ. Cách viết SOP cho một việc trong đúng 1 trang, làm trong một buổi chiều:","1/ Chọn 1 việc cụ thể: làm mỗi tuần, ≥2 người làm, hay sai. 2/ Quay lại cách người giỏi nhất đang làm. Chưa sửa gì, chỉ ghi đúng thực tế.","3/ Tách 5–10 bước, mỗi bước bắt đầu bằng động từ (Mở, Nhập, Kiểm tra, Gửi). Ghi đầu vào, đầu ra, nhánh \"Nếu… thì…\". 4/ Mỗi SOP 1 người chủ, \"xong là khi…\" phải kiểm tra được.","5/ Gói vào 1 trang: mục đích, các bước, lỗi hay gặp, phiên bản. Dài hơn thì tách 2 SOP. 6/ Cho người mới tự làm theo; chỗ họ hỏi lại là chỗ phải sửa.","SOP rõ thì máy mới làm thay được. Gửi SOP đầu tiên để Dream Labs xem bước nào giao cho máy trong buổi tư vấn 30 phút miễn phí: Zalo 0934 246 420. dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p03/slide-1.jpg","media/p03/slide-2.jpg","media/p03/slide-3.jpg","media/p03/slide-4.jpg"]},"zalo_oa":{"tieu_de":"Viết quy trình SOP trong 1 trang","noi_dung":"Chọn một việc lặp lại, quay lại cách người giỏi nhất đang làm, tách 5–10 bước bắt đầu bằng động từ, ghi người chịu trách nhiệm và tiêu chí xong, gói vào một trang, rồi cho người mới chạy thử. SOP rõ thì mới tự động hóa được. Gửi SOP đầu tiên để Dream Labs xem thử trong buổi tư vấn 30 phút miễn phí.","nut":{"nhan":"Đọc thêm","link":"https://dreamlabs.vn/blog/tu-dong-hoa-quy-trinh-doanh-nghiep-bang-ai/"},"anh":"media/p03/slide-1.jpg"},"ghi_chu":"Bài carousel: TikTok để dạng photo, script dùng làm chữ/lồng tiếng cho slide ảnh."},{"stt":4,"ngay":"2026-11-23","thu":"Thứ Hai","tru_cot":"Chuẩn hóa · Website","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa trang chủ website: 7 khối cần có theo thứ tự (khách là ai, lợi ích, sản phẩm, lý do tin, quy trình, câu hỏi thường gặp, liên hệ) và checklist kiểm tra trên điện thoại","tieu_de":"Trang chủ website cần 7 khối theo đúng thứ tự này","demo":"Video quay cuộn mẫu website concept Ombrève trên điện thoại","loai_media":"video","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p04/video.mp4","anh_bia":"media/p04/cover.jpg","carousel":["media/p04/slide-1.jpg","media/p04/slide-2.jpg","media/p04/slide-3.jpg","media/p04/slide-4.jpg","media/p04/slide-5.jpg","media/p04/slide-6.jpg","media/p04/slide-7.jpg","media/p04/slide-8.jpg","media/p04/slide-9.jpg","media/p04/slide-10.jpg","media/p04/slide-11.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Khách vào trang chủ của bạn, cuộn hai lần rồi thoát. Vì sao?\n\nThường không phải vì web xấu. Mà vì trang chủ trả lời sai thứ tự câu hỏi trong đầu khách: “Cái này dành cho tôi không? Tôi được gì? Có tin được không? Làm sao liên hệ?”.\n\nMột trang chủ chuẩn hóa là trang ai trong công ty cũng sửa được mà không phá bố cục, vì mỗi khối có một nhiệm vụ rõ ràng. Dưới đây là 7 khối, gom thành 6 bước, anh chị có thể tự rà lại trang hiện tại ngay trong buổi chiều nay, chỉ cần một tờ giấy và chiếc điện thoại.\n\n▸ 6 BƯỚC DỰNG LẠI TRANG CHỦ THEO 7 KHỐI\n\n1. Khối 1–2: khách là ai và được lợi gì\nĐầu trang chỉ một câu: bạn làm gì, cho ai, khách được lợi gì. Dưới đó 3 lợi ích ngắn, mỗi cái một dòng, nói kết quả chứ không nói tính năng. Câu này phải đọc hiểu trong 5 giây. Nếu phải giải thích thêm, nó còn dài.\nCông cụ gợi ý: Tài liệu văn bản, nhờ 3 khách quen đọc thử.\nMẫu chép dùng: Chúng tôi giúp [nhóm khách] [đạt kết quả] mà không cần [nỗi lo]. Lợi ích: 1) … 2) … 3) …\n\n2. Khối 3: sản phẩm hoặc dịch vụ chủ lực\nChọn 3–6 sản phẩm hoặc gói chủ lực, mỗi cái có ảnh, một dòng mô tả, giá hoặc “giá từ”, và nút xem chi tiết. Đừng đưa cả danh mục lên trang chủ. Trang chủ là cửa vào, không phải kho hàng.\nCông cụ gợi ý: Bảng tính danh sách sản phẩm, thư mục ảnh.\nMẫu chép dùng: Tên | Ảnh | Mô tả 1 dòng | Giá từ … (ghi rõ đã/chưa gồm VAT) | Nút: Xem chi tiết\n\n3. Khối 4: lý do để tin\nĐưa bằng chứng có thật: giấy phép, chứng nhận, năm hoạt động, ảnh xưởng hoặc đội ngũ, chính sách đổi trả. Chưa có thì để trống, đừng bịa. Một tấm ảnh thật nơi làm việc đáng tin hơn mười câu khen chung chung không rõ ai viết.\nCông cụ gợi ý: Thư mục giấy tờ, ảnh chụp thực tế.\nMẫu chép dùng: ☐ Giấy phép/chứng nhận ☐ Ảnh thật nơi làm việc ☐ Cam kết bảo hành/đổi trả ☐ Đánh giá thật có sự đồng ý của khách\n\n4. Khối 5: quy trình làm việc\nTóm 3–5 bước từ lúc khách liên hệ đến lúc nhận hàng hoặc dịch vụ, mỗi bước kèm thời gian. Khách bớt lo vì biết trước điều gì sẽ xảy ra. Khối này cũng giúp đội ngũ của anh chị nói cùng một cách khi tư vấn.\nCông cụ gợi ý: Giấy nháp, sơ đồ đơn giản.\nMẫu chép dùng: Bước 1 Liên hệ (trong ngày) → Bước 2 Tư vấn, báo giá (1–2 ngày) → Bước 3 Thực hiện (… ngày) → Bước 4 Bàn giao\n\n5. Khối 6: câu hỏi thường gặp\nLấy 5–8 câu khách hỏi lặp lại trong tin nhắn: giá, thời gian, giao hàng, thanh toán, bảo hành. Trả lời ngắn, rõ, không vòng vo. Mỗi câu trả lời ở đây là một tin nhắn nhân viên không phải gõ lại.\nCông cụ gợi ý: Lịch sử tin nhắn Zalo OA/Messenger, bảng tính.\nMẫu chép dùng: Hỏi: Bao lâu thì nhận hàng? — Đáp: Nội thành 1–2 ngày, tỉnh 3–5 ngày, phí giao hàng …\n\n6. Khối 7: liên hệ, rồi kiểm tra trên điện thoại\nCuối trang có số điện thoại, nút nhắn Zalo, form 2–3 trường. Mở trang trên điện thoại thật, bấm thử từng nút, thử đọc bằng một tay. Kiểm tra trên điện thoại thật bằng 4G, không chỉ thu nhỏ cửa sổ trình duyệt trên máy tính.\nCông cụ gợi ý: Điện thoại thật, mạng 4G, PageSpeed Insights.\nMẫu chép dùng: ☐ Chữ thân bài ≥ 16px ☐ Nút đủ to để bấm ☐ Không cuộn ngang ☐ Nút gọi/Zalo luôn thấy ☐ Form gửi thử thành công\n\n▸ CHECKLIST 7 KHỐI (IN RA, ĐÁNH DẤU)\n\n☐ Câu mở đầu nói rõ khách được gì\n☐ 3 lợi ích, mỗi cái một dòng\n☐ Sản phẩm chủ lực có giá hoặc “giá từ”\n☐ Ít nhất 2 bằng chứng có thật\n☐ Quy trình có thời gian từng bước\n☐ 5–8 câu hỏi thường gặp\n☐ Số điện thoại, Zalo, form ở cuối trang và trên thanh cố định\n\n▸ LỖI HAY GẶP\n\n✕ Mở đầu bằng “Chào mừng đến với…” thay vì nói khách được gì. Thay bằng câu lợi ích ở bước 1.\n✕ Slide ảnh tự chạy, chữ nhỏ, khách không kịp đọc đã chuyển ảnh. Một ảnh tĩnh rõ ràng kèm một câu thường dễ đọc hơn.\n✕ Chỉ duyệt trên máy tính, không ai mở thử trên điện thoại. Khách thường lướt bằng điện thoại, nên duyệt trên điện thoại trước.\n\n▸ XEM 7 KHỐI CHẠY TRÊN ĐIỆN THOẠI\n\nVideo kèm bài là cảnh quay cuộn mẫu website Ombrève trên điện thoại. Đây là mẫu concept do Dream Labs thiết kế, không phải khách hàng. Anh chị để ý thứ tự: câu lợi ích ở màn đầu, sản phẩm ngay sau, rồi lý do tin, quy trình, câu hỏi và nút liên hệ luôn nằm trong tầm ngón cái.\n\n▸ MUỐN CÓ NGƯỜI RÀ CÙNG?\n\nGửi link trang chủ hiện tại qua Zalo 0934 246 420, Dream Labs sẽ cùng anh chị đối chiếu với checklist 7 khối trong buổi tư vấn 30 phút miễn phí. Nếu cần làm lại, gói website Cơ bản từ 8.000.000đ (chưa gồm VAT). Xem thêm tại dreamlabs.vn.","media":["media/p04/video.mp4"],"media_phu":["media/p04/slide-1.jpg","media/p04/slide-2.jpg","media/p04/slide-3.jpg","media/p04/slide-4.jpg","media/p04/slide-5.jpg","media/p04/slide-6.jpg","media/p04/slide-7.jpg","media/p04/slide-8.jpg","media/p04/slide-9.jpg","media/p04/slide-10.jpg","media/p04/slide-11.jpg"]},"instagram":{"caption":"Khách vào trang chủ, cuộn hai lần rồi thoát. Thường là vì trang trả lời sai thứ tự câu hỏi trong đầu họ.\n\nMột trang chủ chuẩn có 7 khối, theo đúng thứ tự:\n1. Khách là ai\n2. Họ được lợi gì\n3. Sản phẩm chủ lực, có giá hoặc “giá từ”\n4. Lý do để tin, bằng chứng có thật\n5. Quy trình làm việc, kèm thời gian\n6. Câu hỏi thường gặp\n7. Liên hệ: điện thoại, Zalo, form ngắn\n\nLướt carousel để xem từng bước, kèm mẫu câu chép dùng được và checklist kiểm tra trên điện thoại: chữ đủ to, nút đủ lớn, không cuộn ngang, form gửi thử thành công.\n\nMẹo nhỏ: duyệt trang trên điện thoại thật bằng 4G trước, rồi mới xem trên máy tính.\n\nẢnh minh họa lấy từ mẫu website Ombrève, mẫu concept do Dream Labs  Thường là do trang trả lời sai thứ tự câu hỏi trong đầu họ. Đây là 7 khối nên có, theo đúng thứ tự 🧵","1–2. Một câu: bạn giúp ai đạt kết quả gì. Dưới đó 3 lợi ích, mỗi cái một dòng.\n3. 3–6 sản phẩm chủ lực, có ảnh, mô tả 1 dòng, giá hoặc “giá từ”.","4. Lý do để tin: giấy phép, ảnh thật nơi làm việc, chính sách đổi trả. Chưa có thì để trống, đừng bịa.\n5. Quy trình 3–5 bước, mỗi bước kèm thời gian.","6. 5–8 câu hỏi khách hỏi lặp lại trong tin nhắn.\n7. Điện thoại, nút Zalo, form 2–3 trường.\nRồi mở trên điện thoại thật bằng 4G: chữ ≥16px, nút đủ to, không cuộn ngang.","Muốn có người rà trang chủ cùng? Tư vấn 30 phút miễn phí, nhắn Zalo 0934 246 420 hoặc xem dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p04/video.mp4"]},"zalo_oa":{"tieu_de":"Checklist 7 khối cho trang chủ website","noi_dung":"Trang chủ chuẩn trả lời đúng thứ tự câu hỏi của khách: khách là ai, được lợi gì, sản phẩm và giá, lý do để tin, quy trình, câu hỏi thường gặp, liên hệ. Dream Labs gửi anh chị checklist kiểm tra trên điện thoại: chữ đủ to, nút đủ lớn, form gửi thử thành công. Gửi link web để được rà cùng trong buổi tư vấn 30 phút miễn phí.","nut":{"nhan":"Xem dịch vụ web","link":"https://dreamlabs.vn/thiet-ke-website/"},"anh":"media/p04/cover.jpg"},"ghi_chu":"Nhạc: chọn khi duyệt bài. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":5,"ngay":"2026-11-24","thu":"Thứ Ba","tru_cot":"Chuẩn hóa · Bán hàng","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa quy trình bán hàng thành 5 giai đoạn (khách mới → đã tư vấn → đã báo giá → chốt → sau bán), định nghĩa từng giai đoạn và bảng theo dõi","tieu_de":"Bán hàng thành 5 giai đoạn: biết khách đang ở đâu","demo":"Ảnh demo mô phỏng Vọng Nguyệt Residences: chấm điểm và đẩy khách vào CRM","loai_media":"carousel","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p05/slide-1.jpg","media/p05/slide-2.jpg","media/p05/slide-3.jpg","media/p05/slide-4.jpg","media/p05/slide-5.jpg","media/p05/slide-6.jpg","media/p05/slide-7.jpg","media/p05/slide-8.jpg","media/p05/slide-9.jpg","media/p05/slide-10.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"“Khách này tới đâu rồi em?” Nếu câu này hỏi ba lần mỗi ngày…\n\n…thì vấn đề không nằm ở nhân viên. Vấn đề là đội bán hàng chưa có chung một ngôn ngữ để nói về khách. Người gọi là “khách nóng”, người gọi là “đang chờ”, người chỉ nhớ trong đầu.\n\nChuẩn hóa bán hàng không cần phần mềm đắt tiền ngay từ đầu. Chỉ cần thống nhất 5 giai đoạn, định nghĩa rõ thế nào là “đã sang giai đoạn tiếp theo”, và một bảng theo dõi mà ai cũng cập nhật. Khi đó anh chị nhìn một màn hình là biết khách đang kẹt ở đâu.\n\n▸ 5 BƯỚC CHUẨN HÓA QUY TRÌNH BÁN HÀNG\n\n1. Thống nhất 5 giai đoạn và tên gọi\nDùng đúng 5 tên: Khách mới → Đã tư vấn → Đã báo giá → Chốt → Sau bán. Cả đội dùng chung, không thêm tên riêng như “hơi nóng”, “để xem”. Tên ít và cố định thì báo cáo mới cộng được.\nCông cụ gợi ý: Nhóm chat nội bộ, một trang ghi chú dán lên tường.\nMẫu chép dùng: Khách mới | Đã tư vấn | Đã báo giá | Chốt | Sau bán (và một cột phụ: Rớt – lý do)\n\n2. Viết điều kiện “qua cửa” cho từng giai đoạn\nMỗi giai đoạn có một điều kiện kiểm được. Ví dụ: “Đã báo giá” chỉ khi khách đã nhận file báo giá có số tiền và hạn hiệu lực. Không có điều kiện, nhân viên sẽ đẩy khách sang cột sau cho đẹp số.\nCông cụ gợi ý: Tài liệu văn bản 1 trang.\nMẫu chép dùng: Đã tư vấn = đã nói chuyện ≥ 1 lần, biết nhu cầu & ngân sách. Chốt = đã cọc hoặc ký. Sau bán = đã giao, hẹn chăm sóc.\n\n3. Lập bảng theo dõi chung\nMỗi khách một dòng: tên, kênh đến, nhu cầu, giai đoạn, người phụ trách, ngày chạm gần nhất, việc tiếp theo và hạn. Không ai giữ khách ở sổ riêng. Cột “việc tiếp theo” là cột quan trọng nhất: khách không có việc tiếp theo là khách đang trôi.\nCông cụ gợi ý: Google Sheets hoặc phần mềm CRM.\nMẫu chép dùng: Tên | SĐT | Kênh | Nhu cầu | Giai đoạn | Phụ trách | Chạm gần nhất | Việc tiếp theo | Hạn\n\n4. Đặt thời hạn tối đa ở mỗi giai đoạn\nQuy định khách không nằm quá X ngày ở một cột. Ví dụ: Khách mới phải được liên hệ trong 24 giờ, Đã báo giá phải được hỏi lại sau 3 ngày. Tô màu ô quá hạn để cả đội cùng thấy.\nCông cụ gợi ý: Định dạng có điều kiện trong bảng tính.\nMẫu chép dùng: Khách mới ≤ 1 ngày · Đã tư vấn ≤ 5 ngày · Đã báo giá ≤ 3 ngày thì gọi lại · Sau bán: chạm ngày 3 và ngày 30\n\n5. Họp 15 phút mỗi tuần theo bảng\nMỗi thứ Hai, lọc bảng theo giai đoạn, xem khách quá hạn và khách rớt. Ghi lý do rớt để tuần sau sửa đúng chỗ. Họp theo bảng, không họp theo trí nhớ.\nCông cụ gợi ý: Bảng tính có bộ lọc, nhóm chat nội bộ.\nMẫu chép dùng: 3 câu họp: Bao nhiêu khách mỗi cột? Ai quá hạn, vì sao? Lý do rớt nào lặp lại ≥ 2 lần?\n\n▸ CHECKLIST TRƯỚC KHI ÁP DỤNG\n\n☐ Cả đội đọc và đồng ý 5 tên giai đoạn\n☐ Mỗi giai đoạn có điều kiện qua cửa viết ra giấy\n☐ Một bảng duy nhất, ai cũng có quyền sửa đúng phần mình\n☐ Cột “việc tiếp theo” không được để trống\n☐ Lịch họp 15 phút cố định mỗi tuần\n\n▸ LỖI HAY GẶP\n\n✕ Đặt 9–10 giai đoạn, nhân viên không nhớ, mỗi người hiểu một kiểu. Giữ 5, cần chi tiết thì thêm cột ghi chú.\n✕ Chuyển khách sang “Đã báo giá” khi mới gửi bảng giá chung, chưa có báo giá riêng. Bám điều kiện qua cửa ở bước 2.\n✕ Không ghi lý do khách rớt, nên không biết lỗi nằm ở giá, sản phẩm hay tư vấn. Thêm cột “Rớt – lý do” với 4–5 lựa chọn cố định.\n\n▸ KHI BẢNG ĐÃ CHUẨN, MÁY CÓ THỂ ĐIỀN GIÚP\n\nẢnh trong bài là demo mô phỏng Vọng Nguyệt Residences, một thương hiệu bất động sản concept do Dream Labs dựng, số liệu minh họa. Khách nhắn hỏi căn hộ, trợ lý AI hỏi thêm nhu cầu, chấm điểm và ghi thẳng vào đúng cột “Khách mới” trong CRM kèm người phụ trách. Lưu ý: máy chỉ điền đúng khi 5 giai đoạn và điều kiện qua cửa đã được anh chị định nghĩa rõ trước.\n\n▸ BẮT ĐẦU TỪ ĐÂU?\n\nLàm thử bảng 5 giai đoạn trong 2 tuần. Khi đã thấy chạy, nếu muốn tin nhắn khách tự vào bảng, gói Khởi động 5.000.000đ (chưa gồm VAT, 5–7 ngày) tự động hóa đúng một quy trình tiếp nhận và phân loại khách. Nhắn Zalo 0934 246 420 để đặt buổi tư vấn 30 phút miễn phí.","media":["media/p05/slide-1.jpg","media/p05/slide-2.jpg","media/p05/slide-3.jpg","media/p05/slide-4.jpg","media/p05/slide-5.jpg","media/p05/slide-6.jpg","media/p05/slide-7.jpg","media/p05/slide-8.jpg","media/p05/slide-9.jpg","media/p05/slide-10.jpg"],"media_phu":[]},"instagram":{"caption":"“Khách này tới đâu rồi em?” Nếu câu này được hỏi ba lần mỗi ngày, đội bán hàng đang thiếu một ngôn ngữ chung.\n\nChuẩn hóa bán hàng thành 5 giai đoạn:\nKhách mới → Đã tư vấn → Đã báo giá → Chốt → Sau bán\n\nMỗi giai đoạn cần một điều kiện “qua cửa” kiểm được. Ví dụ: chỉ gọi là “Đã báo giá” khi khách đã nhận báo giá riêng có số tiền và hạn hiệu lực.\n\nLướt carousel để xem từng bước: bảng theo dõi chung với cột “việc tiếp theo”, thời hạn tối đa ở mỗi cột, và 3 câu hỏi cho buổi họp 15 phút mỗi thứ Hai.\n\nẢnh cuối là demo mô phỏng Vọng Nguyệt Residences (thương hiệu concept, số liệu minh họa): AI chấm điểm khách và đẩy vào CRM, khi quy trình đã rõ ràng.\n\nLưu bài để làm thử 2 tuần. Cần hỏi thêm, nhắn Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#quytrinhbanhang","#salesprocess","#crm","#chuanhoadoanhnghiep","#quanlykhachhang","#doanhnghiepnho","#tudonghoa","#googlesheets","#banhang"],"media":["media/p05/slide-1.jpg","media/p05/slide-2.jpg","media/p05/slide-3.jpg","media/p05/slide-4.jpg","media/p05/slide-5.jpg","media/p05/slide-6.jpg","media/p05/slide-7.jpg","media/p05/slide-8.jpg","media/p05/slide-9.jpg","media/p05/slide-10.jpg"],"reels":null},"tiktok":{"caption":"5 giai đoạn bán hàng để cả đội nói cùng một ngôn ngữ. Lưu lại, áp dụng tuần này.","hashtags":["#banhang","#crm","#dreamlabs","#doanhnghiepnho"],"dang":"photo","kich_ban":[{"t":"0–3s","screen":"Khách này tới đâu rồi em?","voice":"Ngày nào cũng phải hỏi khách này tới đâu rồi?"},{"t":"3–8s","screen":"5 giai đoạn, một tên gọi chung","voice":"Thống nhất năm giai đoạn: khách mới, đã tư vấn, đã báo giá, chốt, sau bán."},{"t":"8–13s","screen":"Mỗi cột có điều kiện qua cửa","voice":"Mỗi giai đoạn có một điều kiện kiểm được, không ai đẩy khách cho đẹp số."},{"t":"13–18s","screen":"Một bảng, cột việc tiếp theo","voice":"Mỗi khách một dòng, luôn có việc tiếp theo và hạn."},{"t":"18–23s","screen":"Quá hạn thì tô đỏ","voice":"Đặt thời hạn ở từng cột, quá hạn là cả đội cùng thấy."},{"t":"23–27s","screen":"Họp 15 phút mỗi thứ Hai","voice":"Họp mười lăm phút theo bảng, ghi lý do khách rớt."},{"t":"27–31s","screen":"Demo mô phỏng · Dream Labs","voice":"Ảnh cuối là demo mô phỏng AI đẩy khách vào CRM, số liệu minh họa."}],"media":["media/p05/slide-1.jpg","media/p05/slide-2.jpg","media/p05/slide-3.jpg","media/p05/slide-4.jpg","media/p05/slide-5.jpg","media/p05/slide-6.jpg","media/p05/slide-7.jpg","media/p05/slide-8.jpg","media/p05/slide-9.jpg","media/p05/slide-10.jpg"]},"x":{"tweet":"Bán hàng chỉ cần 5 giai đoạn: Khách mới → Đã tư vấn → Đã báo giá → Chốt → Sau bán. Mỗi giai đoạn một điều kiện “qua cửa”, một bảng chung, cột “việc tiếp theo” không bỏ trống. Mẫu bảng: dreamlabs.vn","thread":["“Khách này tới đâu rồi em?” Nếu câu này hỏi ba lần mỗi ngày, đội bán hàng đang thiếu ngôn ngữ chung. Cách chuẩn hóa trong 5 bước:","1. Đúng 5 tên: Khách mới → Đã tư vấn → Đã báo giá → Chốt → Sau bán.\n2. Mỗi cột một điều kiện qua cửa. Ví dụ “Đã báo giá” = khách đã nhận báo giá riêng có số tiền và hạn.","3. Một bảng chung: Tên | Kênh | Nhu cầu | Giai đoạn | Phụ trách | Chạm gần nhất | Việc tiếp theo | Hạn.\n4. Thời hạn từng cột, ví dụ Khách mới liên hệ trong 24 giờ.","5. Họp 15 phút mỗi thứ Hai, 3 câu: mỗi cột bao nhiêu khách, ai quá hạn, lý do rớt nào lặp lại?","Bảng chạy ổn rồi thì mới nên cho máy điền giúp. Tư vấn 30 phút miễn phí qua Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p05/slide-1.jpg","media/p05/slide-2.jpg","media/p05/slide-3.jpg","media/p05/slide-4.jpg"]},"zalo_oa":{"tieu_de":"5 giai đoạn bán hàng và mẫu bảng theo dõi","noi_dung":"Khách mới, Đã tư vấn, Đã báo giá, Chốt, Sau bán. Năm tên gọi chung giúp cả đội biết khách đang ở đâu. Dream Labs gửi anh chị mẫu bảng theo dõi, điều kiện qua cửa cho từng giai đoạn và 3 câu hỏi cho buổi họp 15 phút mỗi tuần. Khi bảng đã chạy, chúng tôi có thể giúp tin nhắn khách tự vào đúng cột.","nut":{"nhan":"Xem tự động hóa","link":"https://dreamlabs.vn/tu-dong-hoa-quy-trinh-doanh-nghiep/"},"anh":"media/p05/slide-1.jpg"},"ghi_chu":""},{"stt":6,"ngay":"2026-11-25","thu":"Thứ Tư","tru_cot":"Chuẩn hóa · Nhận diện","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa bao bì và nhãn sản phẩm: thông tin bắt buộc, thứ bậc chữ, màu theo dòng, file in CMYK, duyệt bản in thử, ảnh 3D trước khi in","tieu_de":"Chuẩn hóa bao bì và nhãn trước khi in lô đầu tiên","demo":"Video bao bì concept Khuê Lam xoay 360 và 3 biến thể màu","loai_media":"video","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p06/video.mp4","anh_bia":"media/p06/cover.jpg","carousel":["media/p06/slide-1.jpg","media/p06/slide-2.jpg","media/p06/slide-3.jpg","media/p06/slide-4.jpg","media/p06/slide-5.jpg","media/p06/slide-6.jpg","media/p06/slide-7.jpg","media/p06/slide-8.jpg","media/p06/slide-9.jpg","media/p06/slide-10.jpg","media/p06/slide-11.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Lỗi bao bì đắt nhất là lỗi phát hiện sau khi in.\n\nTrên màn hình, mọi thứ đều đẹp. Ra xưởng in, màu xanh ngả xám, chữ thành phần nhỏ quá không đọc được, mã vạch quét không lên. Và cả lô hàng nằm chờ.\n\nBao bì không chỉ là chuyện đẹp. Nó là một quy trình có thể kiểm tra từng bước trước khi tốn tiền in. Dưới đây là 6 bước Dream Labs dùng cho mỗi bộ nhãn, anh chị có thể biến thành checklist cho bất kỳ nhà thiết kế nào đang làm cùng mình.\n\n▸ 6 BƯỚC TRƯỚC KHI GỬI FILE ĐI IN\n\n1. Lập danh sách thông tin bắt buộc\nLiệt kê mọi thông tin nhãn phải có theo quy định ngành hàng của anh chị, kiểm với người phụ trách pháp lý hoặc đơn vị tư vấn trước khi thiết kế. Thiết kế xong mới nhét thêm chữ là cách nhanh nhất làm hỏng bố cục.\nCông cụ gợi ý: Bảng tính, văn bản quy định ngành hàng.\nMẫu chép dùng: ☐ Tên sản phẩm ☐ Thành phần ☐ Định lượng ☐ Ngày SX/HSD ☐ Hướng dẫn dùng ☐ Đơn vị chịu trách nhiệm ☐ Xuất xứ ☐ Mã vạch\n\n2. Xếp thứ bậc chữ: 1 lớn, 2 vừa, còn lại nhỏ\nChọn đúng một thứ to nhất (thường là tên sản phẩm), hai thứ vừa (dòng/công dụng, định lượng), phần còn lại cùng một cỡ nhỏ nhưng vẫn đọc được. Khi mọi thứ đều to, khách không biết nhìn vào đâu trước.\nCông cụ gợi ý: Bản in thử khổ thật trên giấy thường.\nMẫu chép dùng: Cấp 1: Tên SP · Cấp 2: Công dụng + định lượng · Cấp 3: thông tin bắt buộc, cỡ đọc được khi cầm cách mắt 30cm\n\n3. Gán một màu chủ đạo cho mỗi dòng\nGiữ nguyên bố cục, logo, phông chữ; chỉ đổi một màu chủ đạo theo dòng hoặc mùi vị. Ghi mã màu CMYK vào bảng chung. Khách nhận ra thương hiệu từ xa nhờ bố cục giống nhau, phân biệt dòng nhờ màu.\nCông cụ gợi ý: Bảng tính mã màu, quạt màu in.\nMẫu chép dùng: Dòng | Màu chủ đạo | Mã CMYK | Mã màu web | Ghi chú (ví dụ: Trà xanh | Xanh lá | C60 M0 Y80 K10 | …)\n\n4. Chuẩn bị file in đúng kỹ thuật\nHỏi xưởng in thông số trước: hệ màu CMYK, tràn lề, vùng an toàn, độ phân giải ảnh, chữ đã chuyển nét. Làm theo khuôn bế của chính xưởng. Mỗi xưởng có yêu cầu riêng, đừng đoán.\nCông cụ gợi ý: Phần mềm thiết kế, khuôn bế từ xưởng in.\nMẫu chép dùng: ☐ CMYK ☐ Tràn lề 3mm ☐ Chữ cách mép ≥ 3mm ☐ Ảnh 300dpi ☐ Chữ chuyển nét ☐ Đúng khuôn bế ☐ Quét thử mã vạch\n\n5. Duyệt bản in thử và ký xác nhận\nYêu cầu bản in thử trên đúng chất liệu. So màu dưới ánh sáng ban ngày, đọc lại từng chữ, ký và ghi ngày lên bản đạt để làm mẫu so khi nhận hàng. Bản in thử có chữ ký là căn cứ khi lô hàng sai màu.\nCông cụ gợi ý: Bản in thử, bút ký, ảnh chụp lưu hồ sơ.\nMẫu chép dùng: Đã kiểm: chính tả ☐ màu ☐ mã vạch ☐ kích thước ☐ — Người duyệt: … Ngày: … — Đạt / Sửa: …\n\n6. Dựng ảnh 3D trước khi in số lượng\nDựng mô hình 3D hoặc ảnh mô phỏng bao bì để duyệt cách nhìn trên kệ, chụp ảnh bán hàng và đăng trước khi hàng về. Ảnh 3D giúp duyệt nhanh với cả đội và dùng luôn cho website, quảng cáo.\nCông cụ gợi ý: Ảnh mô phỏng 3D, bản dựng xoay 360.\nMẫu chép dùng: Góc cần có: mặt trước · mặt sau · nghiêng 45° · cả dòng xếp cạnh nhau · cầm trên tay\n\n▸ CHECKLIST KÝ DUYỆT CUỐI\n\n☐ Đủ thông tin bắt buộc, đã kiểm pháp lý\n☐ Một chữ to nhất, không tranh nhau\n☐ Mã màu CMYK ghi trong bảng chung\n☐ File đúng khuôn bế và thông số xưởng\n☐ Bản in thử có chữ ký, lưu làm mẫu so\n☐ Có ảnh 3D cả dòng trước khi in số lượng\n\n▸ LỖI HAY GẶP\n\n✕ Duyệt màu trên màn hình điện thoại rồi đòi bản in giống y hệt. Màn hình và giấy in khác nhau, chỉ duyệt màu trên bản in thử.\n✕ Mỗi dòng sản phẩm thuê một người, ra mỗi nhãn một phong cách. Làm hệ nhãn chung rồi mới chia màu theo dòng.\n✕ Bỏ qua bản in thử để kịp ngày ra mắt. Chậm vài ngày vẫn rẻ hơn in lại cả lô.\n\n▸ MỘT BỐ CỤC, BA MÀU, XOAY 360\n\nVideo kèm bài là bao bì Khuê Lam, mẫu concept do Dream Labs thiết kế. Anh chị sẽ thấy cùng một hệ nhãn chạy ra ba biến thể màu, và bản dựng xoay 360 để duyệt mọi mặt hộp trước khi gửi xưởng. Đây chính là bước 3 và bước 6 trong bài.\n\n▸ CẦN NGƯỜI SOÁT FILE TRƯỚC KHI IN?\n\nGửi file nhãn hiện tại qua Zalo 0934 246 420, chúng tôi cùng anh chị soát theo checklist trong buổi tư vấn 30 phút miễn phí. Thiết kế bao bì tại Dream Labs từ 2.000.000đ (chưa gồm VAT).","media":["media/p06/video.mp4"],"media_phu":["media/p06/slide-1.jpg","media/p06/slide-2.jpg","media/p06/slide-3.jpg","media/p06/slide-4.jpg","media/p06/slide-5.jpg","media/p06/slide-6.jpg","media/p06/slide-7.jpg","media/p06/slide-8.jpg","media/p06/slide-9.jpg","media/p06/slide-10.jpg","media/p06/slide-11.jpg"]},"instagram":{"caption":"Lỗi bao bì đắt nhất là lỗi phát hiện sau khi in.\n\nTrước khi gửi file đi xưởng, đi qua 6 bước:\n1. Danh sách thông tin bắt buộc, kiểm pháp lý trước khi thiết kế\n2. Thứ bậc chữ: một thứ to nhất, hai thứ vừa, còn lại nhỏ nhưng đọc được\n3. Một màu chủ đạo cho mỗi dòng, ghi mã CMYK vào bảng chung\n4. File in đúng thông số xưởng: CMYK, tràn lề, chữ chuyển nét, khuôn bế\n5. Duyệt bản in thử trên đúng chất liệu, ký và ghi ngày\n6. Dựng ảnh 3D cả dòng trước khi in số lượng\n\nLướt carousel để xem từng bước và checklist ký duyệt cuối.\n\nVideo minh họa: bao bì Khuê Lam xoay 360 với 3 biến thể màu, mẫu concept do Dream Labs thiết kế.\n\nCần soát file trước khi in? Nhắn Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#thietkebaobi","#packagingdesign","#nhansanpham","#baobisanpham","#inan","#chuanhoathuonghieu","#branding","#doanhnghiepnho","#3dpackaging","#labeldesign"],"media":["media/p06/slide-1.jpg","media/p06/slide-2.jpg","media/p06/slide-3.jpg","media/p06/slide-4.jpg","media/p06/slide-5.jpg","media/p06/slide-6.jpg","media/p06/slide-7.jpg","media/p06/slide-8.jpg","media/p06/slide-9.jpg","media/p06/slide-10.jpg","media/p06/slide-11.jpg"],"reels":"media/p06/video.mp4"},"tiktok":{"caption":"6 bước soát bao bì trước khi in để không phải in lại cả lô. Lưu lại trước khi gửi file đi xưởng.","hashtags":["#thietkebaobi","#packaging","#dreamlabs","#inan"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"In 2.000 hộp rồi mới thấy sai?","voice":"In xong hai nghìn hộp mới thấy thiếu thông tin?"},{"t":"3–8s","screen":"1. Đủ thông tin bắt buộc","voice":"Liệt kê thông tin bắt buộc và kiểm pháp lý trước khi thiết kế."},{"t":"8–13s","screen":"2. Một chữ to nhất","voice":"Chỉ một thứ to nhất, hai thứ vừa, còn lại nhỏ nhưng đọc được."},{"t":"13–18s","screen":"3. Mỗi dòng một màu","voice":"Giữ bố cục chung, mỗi dòng chỉ đổi một màu chủ đạo."},{"t":"18–23s","screen":"4–5. File chuẩn, in thử có ký","voice":"Làm file theo thông số xưởng và ký duyệt bản in thử."},{"t":"23–28s","screen":"6. Xoay 3D trước khi in","voice":"Dựng ảnh 3D cả dòng để duyệt trước khi in số lượng."},{"t":"28–32s","screen":"Mẫu concept Khuê Lam · Dream Labs","voice":"Bao bì trong video là mẫu concept do Dream Labs thiết kế."}],"media":["media/p06/video.mp4"]},"x":{"tweet":"Trước khi in bao bì: đủ thông tin bắt buộc → một chữ to nhất → mỗi dòng một màu CMYK → file đúng khuôn bế → bản in thử có chữ ký → ảnh 3D cả dòng. Checklist: dreamlabs.vn","thread":["Lỗi bao bì đắt nhất là lỗi phát hiện sau khi in. 6 bước soát trước khi gửi file đi xưởng:","1. Liệt kê thông tin bắt buộc theo ngành hàng, kiểm pháp lý trước khi thiết kế.\n2. Thứ bậc chữ: 1 to nhất (tên SP), 2 vừa, còn lại cùng một cỡ nhỏ nhưng đọc được.","3. Giữ bố cục, logo, phông; mỗi dòng chỉ đổi một màu chủ đạo, ghi mã CMYK vào bảng chung.\n4. Hỏi xưởng thông số: CMYK, tràn lề 3mm, ảnh 300dpi, chữ chuyển nét, khuôn bế.","5. Duyệt bản in thử trên đúng chất liệu, ký và ghi ngày để làm mẫu so khi nhận hàng.\n6. Dựng ảnh 3D cả dòng để duyệt và chụp ảnh bán hàng trước.","Cần soát file nhãn trước khi in? Tư vấn 30 phút miễn phí, Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p06/video.mp4"]},"zalo_oa":{"tieu_de":"6 bước soát bao bì trước khi gửi file in","noi_dung":"Đủ thông tin bắt buộc, thứ bậc chữ rõ, mỗi dòng một màu chủ đạo, file đúng thông số xưởng, bản in thử có chữ ký và ảnh 3D cả dòng. Dream Labs gửi anh chị checklist ký duyệt cuối để dùng với bất kỳ nhà thiết kế nào. Gửi file nhãn hiện tại để được soát cùng trong buổi tư vấn 30 phút miễn phí.","nut":{"nhan":"Xem thiết kế bao bì","link":"https://dreamlabs.vn/thiet-ke-bao-bi/"},"anh":"media/p06/cover.jpg"},"ghi_chu":"Bước 1 không liệt kê quy định cụ thể của từng ngành; khuyên khách kiểm với người phụ trách pháp lý. Nhạc: chọn khi duyệt bài. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":7,"ngay":"2026-11-26","thu":"Thứ Năm","tru_cot":"Chuẩn hóa · Website","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Kiểm tra sức khỏe website trong 10 phút mỗi tháng: tốc độ trên 4G, PageSpeed Insights, ảnh nặng, nút liên hệ, form gửi thử, thông tin còn đúng","tieu_de":"Khám sức khỏe website 10 phút mỗi tháng","demo":"Ảnh mẫu website concept Orvanthe và Lavrène","loai_media":"carousel","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p07/slide-1.jpg","media/p07/slide-2.jpg","media/p07/slide-3.jpg","media/p07/slide-4.jpg","media/p07/slide-5.jpg","media/p07/slide-6.jpg","media/p07/slide-7.jpg","media/p07/slide-8.jpg","media/p07/slide-9.jpg","media/p07/slide-10.jpg","media/p07/slide-11.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"Lần cuối anh chị tự gửi thử form liên hệ trên web là khi nào?\n\nNếu câu trả lời là “hôm bàn giao web”, rất có thể vài khách đã điền form mà tin nhắn không đến được ai. Website không hỏng ồn ào. Nó hỏng im lặng: một nút bấm không phản hồi, một ảnh mới đăng nặng 8MB, một giờ mở cửa đã đổi từ Tết.\n\nCách chuẩn hóa đơn giản nhất là một buổi “khám” cố định 10 phút mỗi tháng, cùng một người làm, cùng một danh sách. Đặt lịch nhắc vào ngày đầu tháng, mở điện thoại, đi lần lượt 6 bước dưới đây và ghi kết quả vào một bảng.\n\n▸ 6 BƯỚC KHÁM WEBSITE TRONG 10 PHÚT\n\n1. Phút 1–2: mở trang bằng 4G trên điện thoại\nTắt wifi, mở trang chủ và một trang sản phẩm bằng 4G. Đếm nhẩm đến khi thấy nội dung chính. Nếu phải chờ quá lâu, ghi lại trang đó. Khách của anh chị không ngồi cạnh cục phát wifi văn phòng.\nCông cụ gợi ý: Điện thoại thật, mạng 4G.\nMẫu chép dùng: Trang | Thời gian thấy nội dung (ước) | Ổn / Chậm | Ghi chú\n\n2. Phút 3–4: chạy PageSpeed Insights\nDán địa chỉ trang chủ vào PageSpeed Insights, xem tab di động. Ghi điểm và 2–3 gợi ý đầu tiên vào bảng, so với tháng trước. Quan trọng là xu hướng: điểm tụt mạnh so với tháng trước nghĩa là vừa có thứ gì đó làm nặng trang.\nCông cụ gợi ý: PageSpeed Insights.\nMẫu chép dùng: Tháng | Điểm di động | Gợi ý 1 | Gợi ý 2 | So tháng trước: tăng / giảm / giữ\n\n3. Phút 5: soát ảnh mới đăng\nXem lại ảnh đã đăng trong tháng. Ảnh nào chụp thẳng từ điện thoại, chưa nén, nặng vài MB thì nén lại và thay. Một ảnh chưa nén có thể nặng hơn cả phần còn lại của trang cộng lại.\nCông cụ gợi ý: Công cụ nén ảnh, thư mục ảnh web.\nMẫu chép dùng: Quy ước ảnh web: rộng ≤ 1.600px · dung lượng mục tiêu ≤ 300KB · tên file không dấu, ví dụ: hop-qua-tet-do.jpg\n\n4. Phút 6–7: bấm thử mọi nút liên hệ\nBấm nút gọi, nút Zalo, nút Messenger, link bản đồ. Mỗi nút phải mở đúng nơi, đúng số, đúng tài khoản đang có người trực. Số điện thoại cũ của nhân viên đã nghỉ là lỗi rất hay gặp.\nCông cụ gợi ý: Điện thoại thật.\nMẫu chép dùng: ☐ Nút gọi đúng số ☐ Zalo mở đúng OA ☐ Messenger đúng trang ☐ Bản đồ đúng địa chỉ ☐ Email nhận được thư\n\n5. Phút 8: gửi thử form\nĐiền form với tên “TEST + ngày”, gửi đi. Kiểm tra tin đến đúng nơi (email, bảng tính, nhóm chat) và người nhận biết đó là tin thử. Form báo “gửi thành công” chưa chắc là tin đã đến tay người cần nhận.\nCông cụ gợi ý: Form trên web, bảng tính hoặc nhóm chat nội bộ nhận tin.\nMẫu chép dùng: Tên: TEST 01/12 · SĐT: số nội bộ · Nội dung: “Kiểm tra form tháng 12” → đã nhận lúc …, tại …\n\n6. Phút 9–10: soát thông tin còn đúng\nĐọc lại giờ mở cửa, địa chỉ, giá, chương trình khuyến mãi, năm ở chân trang. Thông tin nào hết hạn thì sửa hoặc gỡ ngay. Khuyến mãi đã hết mà vẫn còn trên web dễ gây tranh cãi với khách.\nCông cụ gợi ý: Bảng tính ghi kết quả, lịch nhắc hằng tháng.\nMẫu chép dùng: ☐ Giờ mở cửa ☐ Địa chỉ ☐ Giá/bảng giá ☐ Khuyến mãi còn hạn ☐ Năm ở chân trang ☐ Ảnh đội ngũ còn đúng người\n\n▸ BẢNG KHÁM HẰNG THÁNG (CHÉP VÀO BẢNG TÍNH)\n\n☐ Ngày khám, người khám\n☐ Tốc độ 4G: ổn / chậm\n☐ Điểm PageSpeed di động, so tháng trước\n☐ Số ảnh đã nén lại\n☐ Nút liên hệ: tất cả hoạt động / lỗi ở đâu\n☐ Form: tin thử đến lúc mấy giờ\n☐ Thông tin đã sửa\n\n▸ LỖI HAY GẶP\n\n✕ Chỉ kiểm trên máy tính ở văn phòng có mạng nhanh. Luôn kiểm trên điện thoại bằng 4G.\n✕ Chạy PageSpeed Insights rồi hoảng vì điểm, sửa lung tung. Sửa lần lượt từ gợi ý đầu, thường là ảnh nặng.\n✕ Gửi form thử nhưng không kiểm tin có đến tay người trực hay không. Bước 5 chỉ xong khi người nhận xác nhận đã thấy tin.\n\n▸ MẪU THAM KHẢO\n\nẢnh trong bài là hai mẫu website concept do Dream Labs thiết kế: Orvanthe (đồng hồ) và Lavrène. Anh chị để ý vị trí nút liên hệ luôn nằm trong tầm ngón cái, ảnh sản phẩm đã được nén, chữ thân bài đủ to để đọc trên điện thoại. Đó là những thứ bước 1 và bước 4 sẽ kiểm mỗi tháng.\n\n▸ KHÁM XONG MÀ CÓ NHIỀU Ô ĐỎ?\n\nGửi kết quả bảng khám qua Zalo 0934 246 420. Trong buổi tư vấn 30 phút miễn phí, Dream Labs sẽ cùng anh chị xếp thứ tự việc nên sửa trước, cái nào tự làm được, cái nào cần người kỹ thuật.","media":["media/p07/slide-1.jpg","media/p07/slide-2.jpg","media/p07/slide-3.jpg","media/p07/slide-4.jpg","media/p07/slide-5.jpg","media/p07/slide-6.jpg","media/p07/slide-7.jpg","media/p07/slide-8.jpg","media/p07/slide-9.jpg","media/p07/slide-10.jpg","media/p07/slide-11.jpg"],"media_phu":[]},"instagram":{"caption":"Website không hỏng ồn ào. Nó hỏng im lặng: form không gửi được, số điện thoại cũ, ảnh nặng làm trang chậm.\n\nĐặt lịch “khám” 10 phút mỗi đầu tháng:\nPhút 1–2: mở trang bằng 4G trên điện thoại\nPhút 3–4: chạy PageSpeed Insights, so điểm với tháng trước\nPhút 5: nén lại ảnh mới đăng\nPhút 6–7: bấm thử mọi nút gọi, Zalo, Messenger, bản đồ\nPhút 8: gửi thử form, kiểm tin có đến tay người trực\nPhút 9–10: soát giờ mở cửa, giá, khuyến mãi còn hạn\n\nLướt carousel để xem từng bước và bảng khám chép vào bảng tính dùng ngay. Mẹo: giao cho cùng một người làm mỗi tháng, ghi kết quả vào cùng một bảng để so được với tháng trước.\n\nẢnh minh họa: website concept Orvanthe và Lavrène, mẫu concept do Dream Labs thiết kế.\n\nKhám xong mà nhiều ô đỏ? Nhắn Zalo 0934 246 420 để được tư vấn 30 phút miễn phí. Link ở bio","hashtags":["#dreamlabs","#website","#pagespeed","#tocdowebsite","#baotriwebsite","#chuanhoadoanhnghiep","#doanhnghiepnho","#checklist","#webdesign","#kinhdoanhonline"],"media":["media/p07/slide-1.jpg","media/p07/slide-2.jpg","media/p07/slide-3.jpg","media/p07/slide-4.jpg","media/p07/slide-5.jpg","media/p07/slide-6.jpg","media/p07/slide-7.jpg","media/p07/slide-8.jpg","media/p07/slide-9.jpg","media/p07/slide-10.jpg","media/p07/slide-11.jpg"],"reels":null},"tiktok":{"caption":"Khám website 10 phút mỗi tháng: tốc độ, ảnh, nút liên hệ, form, thông tin. Lưu lại đặt lịch nhắc.","hashtags":["#website","#dreamlabs","#checklist","#kinhdoanhonline"],"dang":"photo","kich_ban":[{"t":"0–3s","screen":"Form web của bạn còn chạy không?","voice":"Lần cuối bạn tự gửi thử form trên web là khi nào?"},{"t":"3–7s","screen":"Phút 1–2: mở bằng 4G","voice":"Tắt wifi, mở trang bằng 4G trên điện thoại."},{"t":"7–11s","screen":"Phút 3–4: PageSpeed Insights","voice":"Chạy PageSpeed Insights, so điểm với tháng trước."},{"t":"11–15s","screen":"Phút 5: nén ảnh mới đăng","voice":"Ảnh mới đăng nặng vài MB thì nén lại."},{"t":"15–20s","screen":"Phút 6–8: bấm nút, gửi form","voice":"Bấm thử mọi nút liên hệ và gửi form thử."},{"t":"20–24s","screen":"Phút 9–10: thông tin còn đúng","voice":"Soát giờ mở cửa, giá và khuyến mãi còn hạn."},{"t":"24–28s","screen":"Mẫu concept · Dream Labs","voice":"Ảnh minh họa là website concept do Dream Labs thiết kế."}],"media":["media/p07/slide-1.jpg","media/p07/slide-2.jpg","media/p07/slide-3.jpg","media/p07/slide-4.jpg","media/p07/slide-5.jpg","media/p07/slide-6.jpg","media/p07/slide-7.jpg","media/p07/slide-8.jpg","media/p07/slide-9.jpg","media/p07/slide-10.jpg","media/p07/slide-11.jpg"]},"x":{"tweet":"Khám website 10 phút mỗi đầu tháng: mở bằng 4G → PageSpeed Insights so với tháng trước → nén ảnh mới → bấm thử mọi nút liên hệ → gửi form thử → soát giá, giờ mở cửa. Bảng khám: dreamlabs.vn","thread":["Website không hỏng ồn ào, nó hỏng im lặng. Đây là buổi “khám” 10 phút mỗi đầu tháng, làm trên điện thoại:","Phút 1–2: tắt wifi, mở trang chủ và một trang sản phẩm bằng 4G.\nPhút 3–4: PageSpeed Insights, tab di động. Ghi điểm và 2 gợi ý đầu, so với tháng trước.","Phút 5: ảnh mới đăng chưa nén thì nén lại (mục tiêu ≤ 300KB).\nPhút 6–7: bấm nút gọi, Zalo, Messenger, bản đồ. Đúng số, đúng tài khoản có người trực chưa?","Phút 8: gửi form tên “TEST + ngày”, kiểm tin đến đúng người.\nPhút 9–10: giờ mở cửa, giá, khuyến mãi còn hạn, năm ở chân trang.","Khám xong nhiều ô đỏ? Tư vấn 30 phút miễn phí để xếp việc nên sửa trước. Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p07/slide-1.jpg","media/p07/slide-2.jpg","media/p07/slide-3.jpg","media/p07/slide-4.jpg"]},"zalo_oa":{"tieu_de":"Khám sức khỏe website 10 phút mỗi tháng","noi_dung":"Website thường hỏng im lặng: form không gửi được, số điện thoại cũ, ảnh nặng làm trang chậm. Dream Labs gửi anh chị bảng khám 6 bước làm trên điện thoại: tốc độ 4G, PageSpeed Insights, ảnh, nút liên hệ, form thử, thông tin còn đúng. Khám xong có nhiều ô đỏ, gửi kết quả để được tư vấn 30 phút miễn phí.","nut":{"nhan":"Xem dịch vụ web","link":"https://dreamlabs.vn/thiet-ke-website/"},"anh":"media/p07/slide-1.jpg"},"ghi_chu":""},{"stt":8,"ngay":"2026-11-27","thu":"Thứ Sáu","tru_cot":"Chuẩn hóa · Báo cáo","uu_tien_zalo":true,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa báo cáo hằng ngày/tuần: chọn 5 chỉ số, một nguồn dữ liệu, mẫu báo cáo 1 trang, giờ gửi cố định, người đọc và hành động","tieu_de":"Báo cáo 1 trang, 5 chỉ số, đến giờ là có","demo":"Video demo mô phỏng bảng điều khiển Ngọc Yên Joaillerie tự gửi báo cáo lúc 7:00 (số liệu minh họa)","loai_media":"video","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p08/video.mp4","anh_bia":"media/p08/cover.jpg","carousel":["media/p08/slide-1.jpg","media/p08/slide-2.jpg","media/p08/slide-3.jpg","media/p08/slide-4.jpg","media/p08/slide-5.jpg","media/p08/slide-6.jpg","media/p08/slide-7.jpg","media/p08/slide-8.jpg","media/p08/slide-9.jpg","media/p08/slide-10.jpg","media/p08/slide-11.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Báo cáo dài 12 trang, nhưng sếp chỉ đọc đúng một con số.\n\nNhiều doanh nghiệp không thiếu số liệu. Họ thiếu một báo cáo ổn định: cùng chỉ số, cùng nguồn, cùng giờ, cùng người đọc. Khi mỗi tuần một kiểu, không ai so được tuần này với tuần trước, và cuộc họp biến thành tranh luận “số này lấy ở đâu”.\n\nChuẩn hóa báo cáo là chọn ít mà đều. Dưới đây là 6 bước để có một báo cáo 1 trang, đến giờ là có, đọc xong biết làm gì. Khi báo cáo đã ổn định như vậy, việc giao cho máy tự tổng hợp và tự gửi mới trở nên khả thi.\n\n▸ 6 BƯỚC CHUẨN HÓA BÁO CÁO\n\n1. Chọn đúng 5 chỉ số\nHỏi người đọc: “Nhìn số nào thì anh chị ra quyết định?”. Giữ 5 chỉ số, mỗi chỉ số có định nghĩa và cách tính viết ra một dòng. Chỉ số không dẫn tới quyết định nào thì để ở phụ lục, không đưa lên trang chính.\nCông cụ gợi ý: Tài liệu văn bản, buổi trao đổi 20 phút.\nMẫu chép dùng: Ví dụ: Doanh thu · Số đơn · Giá trị đơn trung bình · Khách mới · Tỉ lệ khách quay lại (mỗi cái: định nghĩa + cách tính)\n\n2. Một nguồn dữ liệu cho mỗi chỉ số\nGhi rõ mỗi chỉ số lấy từ đâu: phần mềm bán hàng, bảng tính đơn hàng, sổ thu chi. Nếu hai nơi cho hai số khác nhau, chọn một nơi làm chuẩn. Một chỉ số, một nguồn, một người chịu trách nhiệm số đó đúng.\nCông cụ gợi ý: Bảng tính, phần mềm bán hàng hoặc CRM.\nMẫu chép dùng: Chỉ số | Nguồn chuẩn | Người phụ trách số liệu | Chốt số lúc mấy giờ\n\n3. Dựng mẫu báo cáo 1 trang\nMỗi chỉ số một ô: số kỳ này, kỳ trước, chênh lệch, mũi tên tăng/giảm. Bên dưới 3 dòng nhận xét và 1–3 việc cần làm. Cố định bố cục, chỉ thay số. Người đọc quen mắt sẽ đọc nhanh hơn mỗi tuần.\nCông cụ gợi ý: Google Sheets hoặc tài liệu văn bản.\nMẫu chép dùng: Chỉ số | Kỳ này | Kỳ trước | +/- | Ghi chú — Nhận xét: 1) … 2) … 3) … — Việc cần làm: … (ai, hạn)\n\n4. Cố định giờ gửi và kênh gửi\nBáo cáo ngày gửi 7:00 sáng hôm sau, báo cáo tuần gửi 8:00 thứ Hai. Gửi vào đúng một nơi, ví dụ một nhóm chat nội bộ riêng. Giờ cố định tạo thói quen đọc, và làm lộ ngay khi số liệu bị chậm.\nCông cụ gợi ý: Nhóm chat nội bộ, lịch nhắc.\nMẫu chép dùng: Báo cáo ngày: 7:00 · Báo cáo tuần: 8:00 thứ Hai · Kênh: nhóm “Báo cáo” · Người gửi: … · Người dự phòng: …\n\n5. Ghi rõ người đọc và hành động\nMỗi báo cáo có tên người đọc chính. Họ phản hồi bằng một trong ba: “Đã xem”, “Cần làm rõ …”, “Giao việc …”. Báo cáo không ai phản hồi là báo cáo sẽ chết sau vài tuần.\nCông cụ gợi ý: Nhóm chat nội bộ.\nMẫu chép dùng: Người đọc: … · Phản hồi trước 10:00 · Mẫu: ✅ Đã xem / ❓ Cần làm rõ: … / 📌 Giao: [việc] cho [ai] trước [ngày]\n\n6. Xem lại bộ chỉ số mỗi quý\nMỗi quý hỏi lại: chỉ số nào ba tháng không dẫn tới quyết định nào? Bỏ hoặc thay. Ghi lại thay đổi để số các kỳ vẫn so được. Giữ báo cáo gọn quan trọng ngang việc làm nó đầy đủ.\nCông cụ gợi ý: Tài liệu văn bản ghi lịch sử thay đổi.\nMẫu chép dùng: Quý | Chỉ số bỏ | Chỉ số thêm | Lý do | Áp dụng từ ngày\n\n▸ CHECKLIST BÁO CÁO ĐẠT CHUẨN\n\n☐ Đúng 5 chỉ số, mỗi cái có định nghĩa\n☐ Mỗi chỉ số một nguồn chuẩn\n☐ Bố cục 1 trang, không đổi giữa các kỳ\n☐ Giờ gửi và kênh gửi cố định\n☐ Có người đọc chính và hạn phản hồi\n☐ Có 1–3 việc cần làm, ghi ai và hạn\n\n▸ LỖI HAY GẶP\n\n✕ Đưa 20 chỉ số lên một trang vì “số nào cũng quan trọng”. Giữ 5, phần còn lại để phụ lục.\n✕ Lấy doanh thu từ hai nơi, mỗi tuần một nơi, số không khớp. Chốt một nguồn chuẩn ở bước 2.\n✕ Báo cáo chỉ có số, không có nhận xét hay việc cần làm. Thêm 3 dòng nhận xét và 1–3 việc cần làm.\n\n▸ KHI BÁO CÁO ĐÃ CHUẨN, MÁY CÓ THỂ GỬI THAY\n\nVideo kèm bài là demo mô phỏng bảng điều khiển của Ngọc Yên Joaillerie, một thương hiệu trang sức concept do Dream Labs dựng, số liệu minh họa. Đúng 7:00, hệ thống gom số từ bảng đơn hàng, điền vào mẫu 1 trang, AI viết 3 dòng nhận xét và gửi vào nhóm chat. Nó làm được vì 5 chỉ số, nguồn và giờ gửi đã được chuẩn hóa từ trước.\n\n▸ MUỐN BÁO CÁO TỰ ĐẾN MỖI SÁNG?\n\nHãy chạy mẫu 1 trang bằng tay trong 2–4 tuần trước. Khi đã ổn, gói Tăng trưởng 15.000.000đ (chưa gồm VAT, 14 ngày) có phần AI viết báo cáo tuần/tháng. Nhắn Zalo 0934 246 420 để tư vấn 30 phút miễn phí.","media":["media/p08/video.mp4"],"media_phu":["media/p08/slide-1.jpg","media/p08/slide-2.jpg","media/p08/slide-3.jpg","media/p08/slide-4.jpg","media/p08/slide-5.jpg","media/p08/slide-6.jpg","media/p08/slide-7.jpg","media/p08/slide-8.jpg","media/p08/slide-9.jpg","media/p08/slide-10.jpg","media/p08/slide-11.jpg"]},"instagram":{"caption":"Báo cáo dài 12 trang, nhưng người đọc chỉ nhìn đúng một con số.\n\nChuẩn hóa báo cáo là chọn ít mà đều:\n1. Đúng 5 chỉ số, mỗi cái có định nghĩa và cách tính\n2. Mỗi chỉ số một nguồn dữ liệu chuẩn\n3. Mẫu 1 trang: kỳ này, kỳ trước, chênh lệch, 3 dòng nhận xét\n4. Giờ gửi cố định, ví dụ 7:00 sáng, vào đúng một nhóm chat\n5. Có người đọc chính và hành động sau khi đọc\n6. Xem lại bộ chỉ số mỗi quý\n\nLướt carousel để xem từng bước, kèm mẫu bảng chép dùng được. Lời khuyên: chạy mẫu bằng tay 2–4 tuần cho ổn định rồi mới tính chuyện để máy gom số và gửi thay.\n\nVideo minh họa là demo mô phỏng bảng điều khiển Ngọc Yên Joaillerie tự gửi báo cáo lúc 7:00, thương hiệu concept, số liệu minh họa.\n\nMuốn báo cáo tự đến mỗi sáng? Nhắn Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#baocao","#kpi","#dashboard","#googlesheets","#chuanhoadoanhnghiep","#tudonghoa","#AIautomation","#quanlydoanhnghiep","#doanhnghiepnho"],"media":["media/p08/slide-1.jpg","media/p08/slide-2.jpg","media/p08/slide-3.jpg","media/p08/slide-4.jpg","media/p08/slide-5.jpg","media/p08/slide-6.jpg","media/p08/slide-7.jpg","media/p08/slide-8.jpg","media/p08/slide-9.jpg","media/p08/slide-10.jpg","media/p08/slide-11.jpg"],"reels":"media/p08/video.mp4"},"tiktok":{"caption":"Báo cáo 1 o hữu ích là báo cáo ổn định: cùng 5 chỉ số, cùng nguồn, cùng giờ gửi, có người đọc và việc cần làm. Dream Labs gửi anh chị mẫu 1 trang và 6 bước chuẩn hóa. Khi báo cáo đã chạy đều bằng tay, chúng tôi có thể giúp hệ thống tự gom số, AI viết nhận xét và gửi đúng 7:00 mỗi sáng.","nut":{"nhan":"Xem tự động hóa","link":"https://dreamlabs.vn/tu-dong-hoa-quy-trinh-doanh-nghiep/"},"anh":"media/p08/cover.jpg"},"ghi_chu":"5 chỉ số ở bước 1 là ví dụ cho doanh nghiệp bán lẻ, không phải số liệu khách. Nhạc: chọn khi duyệt bài. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":9,"ngay":"2026-11-28","thu":"Thứ Bảy","tru_cot":"Chuẩn hóa · Quy trình","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa cách giao việc và bàn giao dự án: brief 1 trang, mốc tiến độ, số vòng góp ý, nghiệm thu, bàn giao tài sản (file gốc, tài khoản đứng tên doanh nghiệp) — lấy chính quy trình 5 bước của Dream Labs làm ví dụ","tieu_de":"Giao việc và bàn giao dự án: 5 bước không bất ngờ","demo":"Ảnh mẫu bao bì concept Gác Khói và Miên Thảo (bước moodboard)","loai_media":"carousel","gio_dang":{"facebook":"09:30","instagram":"10:30","tiktok":"19:30","zalo_oa":"09:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p09/slide-1.jpg","media/p09/slide-2.jpg","media/p09/slide-3.jpg","media/p09/slide-4.jpg","media/p09/slide-5.jpg","media/p09/slide-6.jpg","media/p09/slide-7.jpg","media/p09/slide-8.jpg","media/p09/slide-9.jpg","media/p09/slide-10.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"Dự án thuê ngoài hay hỏng ở khâu giao nhận, không phải khâu làm.\n\nBrief nói miệng qua điện thoại. Góp ý gửi rải rác trong năm nhóm chat. Không ai nhớ đã sửa mấy vòng. Đến lúc bàn giao mới phát hiện tên miền, tài khoản quảng cáo, file thiết kế gốc đều đứng tên bên làm. Đây là những chuyện rất phổ biến, và đều tránh được nếu quy trình giao nhận được viết ra từ đầu.\n\nĐể minh họa, chúng tôi lấy chính quy trình 5 bước Dream Labs đang dùng: Khám phá → Ý tưởng & moodboard → Thiết kế & dựng → Tinh chỉnh → Bàn giao & đồng hành. Anh chị có thể dùng khung này khi làm việc với bất kỳ đơn vị nào, hoặc khi giao việc cho đội nội bộ.\n\n▸ 5 BƯỚC GIAO VIỆC VÀ BÀN GIAO\n\n1. Khám phá: chốt brief 1 trang\nMột buổi trao đổi 30 phút rồi tóm lại thành brief 1 trang: mục tiêu, khách hàng, sản phẩm bàn giao, hạn chót, ngân sách, ai duyệt cuối. Hai bên cùng xác nhận. Ở Dream Labs, bước này mất 1–2 ngày và kết thúc bằng bản brief tóm tắt gửi lại cho khách.\nCông cụ gợi ý: Tài liệu văn bản 1 trang.\nMẫu chép dùng: Mục tiêu: … · Khách hàng là: … · Bàn giao: … · Hạn: … · Ngân sách: … · Người duyệt cuối: … · Không làm: …\n\n2. Ý tưởng & moodboard: chọn hướng trước\nYêu cầu 2–3 hướng thẩm mỹ bằng moodboard (ảnh tham khảo, màu, chữ) trước khi thiết kế chi tiết. Chọn một hướng, ghi lý do chọn. Đổi hướng ở moodboard tốn vài giờ; đổi hướng khi đã dựng xong tốn vài tuần.\nCông cụ gợi ý: Thư mục ảnh tham khảo, tài liệu trình chiếu.\nMẫu chép dùng: Hướng A/B/C: 3 từ khóa · 5 ảnh tham khảo · bảng màu · phông chữ → Chọn: … vì …\n\n3. Thiết kế & dựng: mốc tiến độ cố định\nThống nhất lịch cập nhật cố định, ví dụ mỗi 3 ngày, gửi vào một kênh duy nhất. Mỗi lần cập nhật nói rõ: đã xong gì, tiếp theo gì, cần khách gì. Dream Labs cập nhật tiến độ mỗi 3 ngày ở bước này; anh chị có thể đặt nhịp phù hợp với dự án của mình.\nCông cụ gợi ý: Nhóm chat nội bộ hoặc bảng theo dõi dự án.\nMẫu chép dùng: Cập nhật [ngày]: Đã xong: … · Tiếp theo: … · Cần anh chị: … trước [ngày] · Rủi ro: …\n\n4. Tinh chỉnh: giới hạn vòng góp ý\nGhi trong thỏa thuận số vòng góp ý. Mỗi vòng gom góp ý vào một danh sách đánh số, một người tổng hợp gửi, kiểm thử trên điện thoại thật. Sửa lỗi kỹ thuật thì không nên tính là một vòng góp ý; nên ghi rõ điều này từ đầu.\nCông cụ gợi ý: Bảng tính góp ý có cột trạng thái.\nMẫu chép dùng: Vòng 1/2 | STT | Vị trí | Góp ý | Người góp | Trạng thái: Chờ / Đã sửa / Không sửa – lý do\n\n5. Bàn giao & đồng hành: nghiệm thu, tài sản\nNghiệm thu theo brief bước 1. Nhận đủ file gốc, mã nguồn, hướng dẫn sử dụng; mọi tài khoản phải đứng tên doanh nghiệp. Ghi rõ thời gian hỗ trợ sau bàn giao. Đổi mật khẩu các tài khoản ngay sau bàn giao và lưu vào nơi an toàn của doanh nghiệp.\nCông cụ gợi ý: Thư mục lưu trữ chung, trình quản lý mật khẩu.\nMẫu chép dùng: ☐ File gốc ☐ Mã nguồn ☐ Tên miền/hosting đứng tên DN ☐ Tài khoản quảng cáo/mạng xã hội ☐ Hướng dẫn dùng ☐ Thời hạn hỗ trợ\n\n▸ CHECKLIST TRƯỚC KHI KÝ VÀ TRƯỚC KHI NHẬN\n\n☐ Brief 1 trang có người duyệt cuối\n☐ Đã chọn một hướng moodboard, có lý do\n☐ Lịch cập nhật và kênh duy nhất\n☐ Số vòng góp ý ghi trong thỏa thuận\n☐ Danh sách tài sản bàn giao, đứng tên doanh nghiệp\n☐ Thời hạn hỗ trợ sau bàn giao\n\n▸ LỖI HAY GẶP\n\n✕ Brief chỉ nói miệng, đến lúc nghiệm thu mỗi bên nhớ một kiểu. Brief 1 trang, hai bên xác nhận bằng văn bản.\n✕ Năm người góp ý ở năm nơi, ý kiến trái ngược nhau. Một người tổng hợp, một danh sách đánh số.\n✕ Tên miền, tài khoản đứng tên người làm, muốn đổi đơn vị thì không lấy lại được. Đưa điều khoản đứng tên doanh nghiệp vào từ đầu.\n\n▸ BƯỚC MOODBOARD TRÔNG NHƯ THẾ NÀO\n\nẢnh trong bài là hai mẫu bao bì concept do Dream Labs thiết kế: Gác Khói (cà phê) và Miên Thảo, ở giai đoạn moodboard. Mỗi hướng có từ khóa, ảnh tham khảo, bảng màu và phông chữ. Khách chọn một hướng trước, nhờ vậy bước thiết kế chi tiết đi thẳng, ít phải làm lại.\n\n▸ ĐANG CHUẨN BỊ THUÊ NGOÀI MỘT DỰ ÁN?\n\nLưu checklist này để dùng với bất kỳ đơn vị nào. Nếu muốn trao đổi về dự án cụ thể, đặt buổi tư vấn 30 phút miễn phí với Dream Labs qua Zalo 0934 246 420; buổi này cũng chính là bước Khám phá.","media":["media/p09/slide-1.jpg","media/p09/slide-2.jpg","media/p09/slide-3.jpg","media/p09/slide-4.jpg","media/p09/slide-5.jpg","media/p09/slide-6.jpg","media/p09/slide-7.jpg","media/p09/slide- dụng với bất kỳ đơn vị nào. Đặt tư vấn 30 phút miễn phí để trao đổi dự án cụ thể.","nut":{"nhan":"Đặt tư vấn","link":"https://dreamlabs.vn/#lien-he"},"anh":"media/p09/slide-1.jpg"},"ghi_chu":"Quy trình 5 bước lấy theo dữ liệu STEPS trên website (Khám phá 1–2 ngày, moodboard 2–4 ngày, cập nhật mỗi 3 ngày, Tinh chỉnh 2–5 ngày). Đã tránh nêu cam kết bảo hành cụ thể."},{"stt":10,"ngay":"2026-11-29","thu":"Chủ nhật","tru_cot":"Chuẩn hóa · Bán hàng","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa báo giá: bảng giá theo cấu hình, mẫu báo giá, thời gian phản hồi, công cụ ước tính giá trên trang, ghi nhận vào bảng theo dõi","tieu_de":"Chuẩn hóa báo giá: cùng câu hỏi, cùng một con số","demo":"Video quay cuộn mẫu landing page concept Ondinea: chọn tuyến, số khách, ra giá ước tính","loai_media":"video","gio_dang":{"facebook":"09:30","instagram":"10:30","tiktok":"19:30","zalo_oa":"09:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p10/video.mp4","anh_bia":"media/p10/cover.jpg","carousel":["media/p10/slide-1.jpg","media/p10/slide-2.jpg","media/p10/slide-3.jpg","media/p10/slide-4.jpg","media/p10/slide-5.jpg","media/p10/slide-6.jpg","media/p10/slide-7.jpg","media/p10/slide-8.jpg","media/p10/slide-9.jpg","media/p10/slide-10.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Cùng một yêu cầu, hai nhân viên báo hai giá. Khách tin ai?\n\nBáo giá là lúc khách so sánh anh chị với đối thủ rõ nhất. Nếu giá phụ thuộc vào ai đang trực, file báo giá mỗi lần một mẫu, và phải chờ đến chiều mai mới có, khách sẽ đi hỏi nơi khác trong lúc chờ.\n\nChuẩn hóa báo giá có nghĩa là: giá được tính từ một bảng cấu hình đã duyệt, gửi bằng một mẫu cố định, trong một thời gian cam kết, và mọi báo giá đều nằm trong một bảng theo dõi. Khi đã có bảng cấu hình, anh chị còn có thể đưa một công cụ ước tính giá lên website để khách tự xem trước.\n\n▸ 5 BƯỚC CHUẨN HÓA BÁO GIÁ\n\n1. Lập bảng giá theo cấu hình\nTách giá thành phần cố định và phần thay đổi theo lựa chọn: kích thước, số lượng, chất liệu, tuyến, số khách… Mỗi lựa chọn một mức giá hoặc hệ số. Bảng này do chủ doanh nghiệp duyệt, nhân viên chỉ chọn, không tự tính.\nCông cụ gợi ý: Bảng tính có công thức.\nMẫu chép dùng: Giá gốc: … + Tùy chọn A: +… + Tùy chọn B: ×… + Phụ phí (gấp/cuối tuần): … = Tạm tính (ghi rõ đã/chưa gồm VAT)\n\n2. Dùng một mẫu báo giá duy nhất\nMột mẫu có logo, số báo giá, ngày, hạn hiệu lực, hạng mục, đơn giá, tổng, điều kiện thanh toán, việc không bao gồm, người liên hệ. Dòng “không bao gồm” giúp tránh tranh cãi về sau nhiều hơn mọi dòng khác.\nCông cụ gợi ý: Tài liệu văn bản hoặc bảng tính xuất PDF.\nMẫu chép dùng: BG-[năm]-[số] · Ngày · Hiệu lực đến · Hạng mục | SL | Đơn giá | Thành tiền · Tổng (VAT) · Không bao gồm: … · Liên hệ: …\n\n3. Cam kết thời gian phản hồi\nĐặt hai mốc: báo giá sơ bộ trong X giờ, báo giá chính thức trong Y ngày làm việc. Ghi mốc này lên website và trong câu trả lời đầu tiên. Khách chấp nhận chờ khi biết phải chờ đến bao giờ.\nCông cụ gợi ý: Lịch nhắc, nhóm chat nội bộ.\nMẫu chép dùng: Ví dụ: Sơ bộ trong 2 giờ làm việc · Chính thức trong 1 ngày làm việc · Ngoài giờ: trả lời trước 9:00 sáng hôm sau\n\n4. Đưa công cụ ước tính giá lên trang\nTừ bảng cấu hình, làm một khối trên website hoặc landing page: khách chọn 2–3 lựa chọn, thấy ngay giá ước tính kèm nút “Nhận báo giá chính thức”. Giá ước tính phải ghi rõ “ước tính”, giá chính thức vẫn qua mẫu ở bước 2.\nCông cụ gợi ý: Website/landing page có khối tính giá.\nMẫu chép dùng: Chọn [lựa chọn 1] · [lựa chọn 2] · [số lượng] → Ước tính từ …đ (chưa gồm VAT) · Nút: Nhận báo giá chính thức\n\n5. Ghi mọi báo giá vào bảng theo dõi\nMỗi báo giá một dòng: số báo giá, khách, giá trị, ngày gửi, hạn, trạng thái. Đến hạn mà khách chưa trả lời thì hỏi lại. Báo giá không theo dõi là báo giá bỏ dở.\nCông cụ gợi ý: Google Sheets hoặc phần mềm CRM.\nMẫu chép dùng: Số BG | Khách | Giá trị | Ngày gửi | Hạn | Trạng thái: Chờ / Hỏi lại / Đồng ý / Từ chối – lý do | Người phụ trách\n\n▸ CHECKLIST MỘT BÁO GIÁ ĐẠT CHUẨN\n\n☐ Giá tính từ bảng cấu hình đã duyệt\n☐ Đúng mẫu, có số báo giá và hạn hiệu lực\n☐ Ghi rõ đã/chưa gồm VAT\n☐ Có dòng “không bao gồm”\n☐ Gửi trong thời gian đã cam kết\n☐ Đã ghi vào bảng theo dõi\n\n▸ LỖI HAY GẶP\n\n✕ Để nhân viên tự tính giá theo kinh nghiệm, mỗi người một kiểu. Mọi giá đi từ bảng cấu hình ở bước 1.\n✕ Báo giá không ghi hạn hiệu lực, khách quay lại sau 6 tháng đòi giá cũ. Luôn có dòng “Hiệu lực đến …”.\n✕ Đưa giá ước tính lên web nhưng không ghi rõ “ước tính”. Ghi “ước tính, chưa gồm VAT” ngay cạnh con số.\n\n▸ CÔNG CỤ ƯỚC TÍNH GIÁ TRÊN TRANG\n\nVideo kèm bài là landing page Ondinea, mẫu concept do Dream Labs thiết kế cho một dịch vụ du thuyền giả định. Khách chọn tuyến, chọn số khách, trang hiện giá ước tính ngay, kèm nút nhận báo giá chính thức. Phía sau là đúng bảng cấu hình ở bước 1, chỉ là được đưa lên giao diện.\n\n▸ MUỐN CÓ KHỐI TÍNH GIÁ TRÊN WEB?\n\nChuẩn bị bảng cấu hình giá ở bước 1 trước. Landing page tại Dream Labs từ 3.000.000đ (chưa gồm VAT); khối tính giá phù hợp với gói nào sẽ được trao đổi cụ thể trong buổi tư vấn 30 phút miễn phí. Nhắn Zalo 0934 246 420.","media":["media/p10/video.mp4"],"media_phu":["media/p10/slide-1.jpg","media/p10/slide-2.jpg","media/p10/slide-3.jpg","media/p10/slide-4.jpg","media/p10/slide-5.jpg","media/p10/slide-6.jpg","media/p10/slide-7.jpg","media/p10/slide-8.jpg","media/p10/slide-9.jpg","media/p10/slide-10.jpg"]},"instagram":{"caption":"Cùng một yêu cầu, hai nhân viên báo hai giá. Khách tin ai?\n\nChuẩn hóa báo giá trong 5 bước:\n1. Bảng giá theo cấu hình: giá gốc cộng từng lựa chọn, chủ doanh nghiệp duyệt\n2. Một mẫu báo giá duy nhất, có số báo giá, hạn hiệu lực và dòng “không bao gồm”\n3. Cam kết thời gian phản hồi, ví dụ sơ bộ trong 2 giờ làm việc\n4. Công cụ ước tính giá trên website, ghi rõ “ước tính”\n5. Mọi báo giá vào một bảng theo dõi, đến hạn thì hỏi lại\n\nLướt carousel để xem từng bước, kèm mẫ
