một yêu cầu, hai nhân viên báo hai giá. 5 bước để báo giá ra cùng một con số, đúng hẹn:","1. Bảng cấu hình: giá gốc + từng lựa chọn (kích thước, số lượng, tuyến…) + phụ phí. Chủ duyệt, nhân viên chỉ chọn.\n2. Một mẫu: số BG, ngày, hạn hiệu lực, hạng mục, VAT, dòng “không bao gồm”.","3. Cam kết giờ: ví dụ sơ bộ trong 2 giờ làm việc, chính thức trong 1 ngày.\n4. Đưa bảng cấu hình lên web thành khối tính giá ước tính, kèm nút nhận báo giá chính thức.","5. Mỗi báo giá một dòng: Số BG | Khách | Giá trị | Ngày gửi | Hạn | Trạng thái. Đến hạn chưa trả lời thì hỏi lại.","Muốn khách tự xem giá ước tính trên web? Tư vấn 30 phút miễn phí: Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p10/video.mp4"]},"zalo_oa":{"tieu_de":"5 bước để báo giá nhanh và thống nhất","noi_dung":"Bảng giá theo cấu hình đã duyệt, một mẫu báo giá có hạn hiệu lực, thời gian phản hồi cam kết, khối ước tính giá trên website và một bảng theo dõi mọi báo giá. Dream Labs gửi anh chị mẫu báo giá và mẫu bảng theo dõi để dùng ngay. Cần đưa công cụ tính giá lên landing page, đặt tư vấn 30 phút miễn phí.","nut":{"nhan":"Xem landing page","link":"https://dreamlabs.vn/thiet-ke-landing-page/"},"anh":"media/p10/cover.jpg"},"ghi_chu":"Không khẳng định khối tính giá nằm trong gói landing nào; để trao đổi khi tư vấn. Nhạc: chọn khi duyệt bài. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":11,"ngay":"2026-11-30","thu":"Thứ Hai","tru_cot":"Chuẩn hóa · Tự động hóa","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chọn quy trình đầu tiên để tự động hóa: liệt kê việc lặp lại, chấm theo 3 điều kiện (lặp hằng ngày, quy tắc rõ, sai sửa được), ước thời gian, chọn 1 và chạy song song 1–2 tuần","tieu_de":"Chọn quy trình đầu tiên để tự động hóa: 3 điều kiện","demo":"Ảnh demo mô phỏng Maison Sương Trầm: concierge hương trực Zalo và website","loai_media":"carousel","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p11/slide-1.jpg","media/p11/slide-2.jpg","media/p11/slide-3.jpg","media/p11/slide-4.jpg","media/p11/slide-5.jpg","media/p11/slide-6.jpg","media/p11/slide-7.jpg","media/p11/slide-8.jpg","media/p11/slide-9.jpg","media/p11/slide-10.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"Đừng tự động hóa việc khó nhất trước.\n\nKhi nghe đến AI, nhiều chủ doanh nghiệp muốn giải quyết ngay việc đau đầu nhất: kế toán, kho, hay chăm sóc khách VIP. Nhưng việc đau đầu nhất thường cũng là việc nhiều ngoại lệ nhất, khó viết thành quy tắc nhất, và sai thì khó sửa nhất.\n\nQuy trình đầu tiên nên là một “chiến thắng nhỏ”: lặp lại mỗi ngày, có quy tắc rõ, và nếu máy làm sai thì người sửa được ngay. Dưới đây là cách chọn trong một buổi chiều, bằng một bảng tính và ba câu hỏi.\n\n▸ 5 BƯỚC CHỌN VÀ THỬ QUY TRÌNH ĐẦU TIÊN\n\n1. Liệt kê mọi việc lặp lại\nMỗi người trong đội ghi 5–10 việc họ làm đi làm lại mỗi ngày hoặc mỗi tuần. Gom lại một danh sách, gộp việc trùng. Hỏi người trực tiếp làm, không đoán từ phòng giám đốc.\nCông cụ gợi ý: Bảng tính chung, nhóm chat nội bộ.\nMẫu chép dùng: Việc | Ai làm | Bao lâu một lần | Mỗi lần mất mấy phút | Dữ liệu vào từ đâu | Kết quả ra đâu\n\n2. Chấm theo 3 điều kiện\nMỗi việc chấm Có/Không cho 3 câu: Lặp hằng ngày? Quy tắc rõ, viết ra được? Sai thì sửa được dễ? Chỉ giữ việc được 3 chữ Có. Thiếu một chữ Có thì để sau, chưa phải lúc.\nCông cụ gợi ý: Bảng tính, thêm 3 cột Có/Không.\nMẫu chép dùng: Lặp hằng ngày ☐ · Quy tắc rõ ☐ · Sai sửa được ☐ → 3/3 thì vào vòng chọn\n\n3. Ước thời gian tiết kiệm\nVới mỗi việc đạt 3/3, tính: phút mỗi lần × số lần mỗi ngày × số ngày làm việc ÷ 60 = giờ mỗi tháng. Đây là phép tính ước lượng. Con số này giúp so các việc với nhau, không phải lời hứa kết quả.\nCông cụ gợi ý: Bảng tính có công thức.\nMẫu chép dùng: Ví dụ: 3 phút × 40 tin/ngày × 26 ngày ÷ 60 = 52 giờ/tháng (phép tính minh họa)\n\n4. Chọn đúng một việc\nChọn việc có nhiều giờ nhất trong nhóm 3/3, ưu tiên việc chạm tới khách (trả lời tin nhắn, ghi đơn). Viết mô tả 1 trang: đầu vào, quy tắc, đầu ra, ngoại lệ. Một việc chạy tốt rồi mới làm việc thứ hai.\nCông cụ gợi ý: Tài liệu văn bản 1 trang.\nMẫu chép dùng: Việc: … · Đầu vào: … · Quy tắc: nếu … thì … · Đầu ra: … · Ngoại lệ chuyển người: … · Người giám sát: …\n\n5. Chạy song song 1–2 tuần\nMáy làm, người vẫn làm hoặc kiểm lại như cũ. Ghi mỗi lần máy sai và lý do. Hết thời gian thử mới quyết định giao hẳn. Chạy song song là cách rẻ nhất để biết máy có đáng tin không.\nCông cụ gợi ý: Bảng tính ghi lỗi.\nMẫu chép dùng: Ngày | Trường hợp | Máy làm gì | Đúng/Sai | Lý do | Cần sửa quy tắc gì\n\n▸ CHECKLIST TRƯỚC KHI GIAO CHO MÁY\n\n☐ Đã có danh sách việc lặp lại từ người trực tiếp làm\n☐ Việc được chọn đạt đủ 3 điều kiện\n☐ Có phép tính giờ mỗi tháng (ước lượng)\n☐ Có mô tả 1 trang: đầu vào, quy tắc, đầu ra, ngoại lệ\n☐ Có người giám sát và bảng ghi lỗi\n☐ Đã chạy song song ít nhất 1 tuần\n\n▸ LỖI HAY GẶP\n\n✕ Chọn việc nhiều ngoại lệ nhất làm việc đầu tiên. Bắt đầu với việc có quy tắc rõ.\n✕ Tự động hóa ba quy trình cùng lúc, lỗi chồng lỗi, không biết sửa ở đâu. Một việc chạy ổn rồi mới làm việc tiếp theo.\n✕ Tắt cách làm cũ ngay ngày đầu, không chạy song song. Giữ cách cũ 1–2 tuần để so.\n\n▸ VÍ DỤ MỘT QUY TRÌNH ĐẦU TIÊN\n\nẢnh trong bài là demo mô phỏng Maison Sương Trầm, một thương hiệu nước hoa concept do Dream Labs dựng, số liệu minh họa. Quy trình được chọn là trả lời câu hỏi về mùi hương trên Zalo và website: lặp hằng ngày, có quy tắc rõ (dựa trên bảng sản phẩm), và câu nào ngoài phạm vi thì chuyển cho người. Đúng ba điều kiện ở bước 2.\n\n▸ CHƯA CHẮC VIỆC NÀO NÊN LÀM TRƯỚC?\n\nMang danh sách ở bước 1 đến buổi tư vấn 30 phút miễn phí, Dream Labs cùng anh chị chấm 3 điều kiện. Gói Khởi động 5.000.000đ (chưa gồm VAT, 5–7 ngày) dành đúng cho một quy trình đầu tiên. Zalo 0934 246 420.","media":["media/p11/slide-1.jpg","media/p11/slide-2.jpg","media/p11/slide-3.jpg","media/p11/slide-4.jpg","media/p11/slide-5.jpg","media/p11/slide-6.jpg","media/p11/slide-7.jpg","media/p11/slide-8.jpg","media/p11/slide-9.jpg","media/p11/slide-10.jpg"],"media_phu":[]},"instagram":{"caption":"Đừng tự động hóa việc khó nhất trước.\n\nQuy trình đầu tiên nên là một chiến thắng nhỏ. Chấm từng việc lặp lại theo 3 điều kiện:\n✓ Lặp lại hằng ngày\n✓ Quy tắc rõ, viết ra được\n✓ Sai thì sửa được dễ\n\nĐủ 3/3 mới vào vòng chọn. Sau đó ước giờ tiết kiệm bằng phép tính: phút mỗi lần × số lần mỗi ngày × số ngày ÷ 60. Chọn đúng một việc, viết mô tả 1 trang, rồi cho máy chạy song song với người 1–2 tuần trước khi giao hẳn.\n\nLướt carousel để xem từng bước, kèm bảng kiểm kê và bảng ghi lỗi chép dùng được.\n\nẢnh minh họa là demo mô phỏng Maison Sương Trầm, thương hiệu concept do Dream Labs dựng: trợ lý tư vấn mùi hương trực Zalo và website, số liệu minh họa.\n\nChưa chắc việc nào làm trước? Nhắn Zalo 0934 246 420 để tư vấn 30 phút miễn phí. Link ở bio","hashtags":["#dreamlabs","#tudonghoa","#AIautomation","#tudonghoaquytrinh","#zalooa","#chuanhoadoanhnghiep","#doanhnghiepnho","#trolyai","#quytrinh","#nangsuat"],"media":["media/p11/slide-1.jpg","media/p11/slide-2.jpg","media/p11/slide-3.jpg","media/p11/slide-4.jpg","media/p11/slide-5.jpg","media/p11/slide-6.jpg","media/p11/slide-7.jpg","media/p11/slide-8.jpg","media/p11/slide-9.jpg","media/p11/slide-10.jpg"],"reels":null},"tiktok":{"caption":"Quy trình đầu tiên nên tự động hóa phải đạt 3 điều kiện. Lưu lại để chấm việc của bạn.","hashtags":["#tudonghoa","#AI","#dreamlabs","#doanhnghiepnho"],"dang":"photo","kich_ban":[{"t":"0–3s","screen":"Đừng tự động hóa việc khó nhất","voice":"Muốn dùng AI? Đừng bắt đầu bằng việc khó nhất."},{"t":"3–8s","screen":"1. Liệt kê việc lặp lại","voice":"Hỏi từng người: việc gì bạn làm đi làm lại mỗi ngày?"},{"t":"8–14s","screen":"2. Lặp ngày · quy tắc rõ · sửa được","voice":"Chấm ba điều kiện: lặp hằng ngày, quy tắc rõ, sai sửa được."},{"t":"14–19s","screen":"3. Phút × lần × ngày ÷ 60","voice":"Ước số giờ mỗi tháng bằng một phép tính đơn giản."},{"t":"19–23s","screen":"4. Chọn đúng một việc","voice":"Chọn đúng một việc, viết mô tả một trang."},{"t":"23–28s","screen":"5. Chạy song song 1–2 tuần","voice":"Cho máy chạy song song với người một đến hai tuần."},{"t":"28–32s","screen":"Demo mô phỏng · Dream Labs","voice":"Ảnh là demo mô phỏng trợ lý trực Zalo, số liệu minh họa."}],"media":["media/p11/slide-1.jpg","media/p11/slide-2.jpg","media/p11/slide-3.jpg","media/p11/slide-4.jpg","media/p11/slide-5.jpg","media/p11/slide-6.jpg","media/p11/slide-7.jpg","media/p11/slide-8.jpg","media/p11/slide-9.jpg","media/p11/slide-10.jpg"]},"x":{"tweet":"Quy trình đầu tiên để tự động hóa phải đạt 3 điều kiện: lặp hằng ngày, quy tắc rõ, sai sửa được. Chọn đúng một việc, chạy song song với người 1–2 tuần rồi mới giao hẳn. Bảng kiểm kê: dreamlabs.vn","thread":["Đừng tự động hóa việc khó nhất trước. Cách chọn quy trình đầu tiên trong một buổi chiều:","1. Mỗi người ghi 5–10 việc lặp lại: ai làm, bao lâu một lần, mỗi lần mấy phút.\n2. Chấm 3 câu Có/Không: lặp hằng ngày? quy tắc rõ? sai sửa được? Chỉ giữ việc 3/3.","3. Ước giờ: phút × lần/ngày × ngày ÷ 60. Ví dụ 3 × 40 × 26 ÷ 60 = 52 giờ/tháng (phép tính minh họa).\n4. Chọn đúng một việc, ưu tiên việc chạm tới khách. Viết mô tả 1 trang.","5. Chạy song song 1–2 tuần: máy làm, người kiểm. Ghi mỗi lần sai và lý do, rồi mới quyết định giao hẳn.","Mang danh sách việc lặp lại đến buổi tư vấn 30 phút miễn phí để chấm cùng. Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p11/slide-1.jpg","media/p11/slide-2.jpg","media/p11/slide-3.jpg","media/p11/slide-4.jpg"]},"zalo_oa":{"tieu_de":"Chọn quy trình đầu tiên để tự động hóa","noi_dung":"Việc đầu tiên nên giao cho máy phải đạt đủ 3 điều kiện: lặp lại hằng ngày, quy tắc rõ, sai thì sửa được dễ. Dream Labs gửi anh chị bảng kiểm kê, công thức ước giờ tiết kiệm và cách chạy song song 1–2 tuần trước khi giao hẳn. Mang danh sách việc lặp lại đến buổi tư vấn 30 phút miễn phí để chấm cùng.","nut":{"nhan":"Đọc hướng dẫn","link":"https://dreamlabs.vn/blog/tu-dong-hoa-quy-trinh-doanh-nghiep-bang-ai/"},"anh":"media/p11/slide-1.jpg"},"ghi_chu":""},{"stt":12,"ngay":"2026-12-01","thu":"Thứ Ba","tru_cot":"Chuẩn hóa · Nội dung","uu_tien_zalo":false,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa sản xuất video ngắn hằng tuần: kho chủ đề, kịch bản 3 phần, quay theo danh sách cảnh, mẫu phụ đề, quy tắc màu/chữ, lịch đăng","tieu_de":"Ra video ngắn mỗi tuần mà không phải nghĩ lại từ đầu","demo":"Video trước/sau edit mẫu Lam Kỳ (cảnh dựng 3D bằng code, thương hiệu concept)","loai_media":"video","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p12/video.mp4","anh_bia":"media/p12/cover.jpg","carousel":["media/p12/slide-1.jpg","media/p12/slide-2.jpg","media/p12/slide-3.jpg","media/p12/slide-4.jpg","media/p12/slide-5.jpg","media/p12/slide-6.jpg","media/p12/slide-7.jpg","media/p12/slide-8.jpg","media/p12/slide-9.jpg","media/p12/slide-10.jpg","media/p12/slide-11.jpg"],"ghi_chu":"9:16, 1080×1920, H.264 cho TikTok/Reels; carousel 4:5 mỗi slide một bước cho Facebook/Instagram"},"facebook":{"noi_dung":"Video ngắn đứt lịch thường không phải vì thiếu ý tưởng.\n\nMà vì mỗi video đều được làm như lần đầu tiên: nghĩ chủ đề từ số không, quay theo cảm hứng, dựng xong mới thấy thiếu cảnh, chọn lại phông chữ phụ đề, rồi đăng lúc nào rảnh. Một video như vậy tốn cả buổi, nên đến tuần thứ ba là bỏ.\n\nChuẩn hóa sản xuất video là biến nó thành dây chuyền nhỏ: có kho chủ đề, kịch bản theo khung, danh sách cảnh, mẫu phụ đề, quy tắc màu chữ và một lịch đăng cố định. Sáu bước dưới đây dùng được cho TikTok, Reels hay video ngắn trên Facebook.\n\n▸ 6 BƯỚC DỰNG DÂY CHUYỀN VIDEO NGẮN\n\n1. Lập kho chủ đề 4 nhóm\nMở một bảng, chia 4 nhóm: câu hỏi khách hay hỏi, hậu trường làm sản phẩm, mẹo dùng sản phẩm, trước/sau. Mỗi nhóm ghi sẵn 5 chủ đề. Câu hỏi trong tin nhắn khách là nguồn chủ đề không bao giờ cạn.\nCông cụ gợi ý: Bảng tính, lịch sử tin nhắn khách.\nMẫu chép dùng: Nhóm | Chủ đề | Câu móc mở đầu | Đã quay? | Ngày đăng — 4 nhóm: Hỏi đáp · Hậu trường · Mẹo · Trước/sau\n\n2. Viết kịch bản theo khung 3 phần\nMóc (0–3 giây): một câu nêu vấn đề. Thân: 2–4 ý, mỗi ý một cảnh. Kết: một việc người xem nên làm. Viết đủ ngắn để đọc to dưới 45 giây. Đọc to kịch bản một lần trước khi quay, chỗ nào vấp là chỗ cần sửa.\nCông cụ gợi ý: Tài liệu văn bản.\nMẫu chép dùng: MÓC: “Bạn có đang …?” · THÂN: Ý 1 … / Ý 2 … / Ý 3 … · KẾT: “Lưu lại / nhắn … để …”\n\n3. Quay theo danh sách cảnh\nTừ kịch bản, lập danh sách cảnh cần quay: cận, trung, toàn, tay thao tác, sản phẩm. Quay mỗi cảnh 2 lần, dọc 9:16, giữ máy yên 2 giây đầu và cuối. Quay luôn 2–3 video một buổi để tiết kiệm công dựng cảnh.\nCông cụ gợi ý: Điện thoại, giá đỡ, đèn, danh sách in ra.\nMẫu chép dùng: Cảnh | Góc (cận/trung/toàn) | Nội dung | Thời lượng | Đã quay ☐ — Thêm 3 cảnh phụ: tay, sản phẩm, không gian\n\n4. Dùng một mẫu phụ đề\nCố định phông chữ, cỡ, màu, viền và vị trí phụ đề. Tối đa 2 dòng, mỗi dòng khoảng 5–7 từ, đặt trong vùng an toàn, không che mặt hay sản phẩm. Lưu mẫu trong phần mềm dựng để lần sau chỉ cần áp vào.\nCông cụ gợi ý: Phần mềm dựng video có lưu mẫu chữ.\nMẫu chép dùng: Phông: … · Cỡ: … · Màu chữ: trắng, viền tối · Vị trí: 1/3 dưới, trong vùng an toàn · ≤ 2 dòng\n\n5. Viết quy tắc màu và chữ thương hiệu\nMột trang ghi: 2–3 màu thương hiệu, 1 phông tiêu đề, 1 phông phụ đề, logo đặt ở đâu, mở và kết video dùng cảnh nào. Ai dựng cũng theo trang này. Quy tắc rõ thì đổi người dựng mà video vẫn nhận ra là của anh chị.\nCông cụ gợi ý: Tài liệu 1 trang, thư mục logo và nhạc.\nMẫu chép dùng: Màu chính: … · Màu nhấn: … · Phông tiêu đề: … · Phông phụ đề: … · Logo: góc …, mờ …% · Kết: logo 2 giây\n\n6. Khóa lịch đăng và ngày sản xuất\nChọn số video mỗi tuần làm được thật, ví dụ 2. Gom một buổi quay, một buổi dựng mỗi tuần. Ghi giờ đăng cố định vào lịch. Đều đặn 2 video mỗi tuần thường bền hơn 7 video tuần đầu rồi bỏ.\nCông cụ gợi ý: Lịch làm việc, bảng tính kế hoạch.\nMẫu chép dùng: Thứ Hai: chọn 2 chủ đề + kịch bản · Thứ Ba: quay · Thứ Tư: dựng · Thứ Năm & Chủ nhật: đăng lúc …\n\n▸ CHECKLIST TRƯỚC KHI ĐĂNG MỖI VIDEO\n\n☐ 3 giây đầu có câu móc rõ\n☐ Mỗi ý một cảnh, không dài quá 45 giây nếu không cần\n☐ Phụ đề đúng mẫu, đã soát chính tả\n☐ Logo và màu đúng quy tắc\n☐ Có lời kêu gọi ở cuối\n☐ Đã ghi ngày đăng vào kho chủ đề\n\n▸ LỖI HAY GẶP\n\n✕ Mở đầu bằng logo 5 giây trước khi vào nội dung. Đưa câu móc lên đầu, logo để cuối.\n✕ Phụ đề mỗi video một phông, một màu, một vị trí. Lưu một mẫu phụ đề và dùng lại.\n✕ Đặt mục tiêu đăng mỗi ngày, ba tuần sau bỏ hẳn. Chọn nhịp làm được thật và giữ nó.\n\n▸ TRƯỚC VÀ SAU KHI ÁP MẪU\n\nVideo kèm bài là bản trước và sau edit của Lam Kỳ, thương hiệu concept do Dream Labs thiết kế; các cảnh 3D được dựng bằng code. Anh chị để ý phần “sau”: phụ đề cùng một mẫu, màu theo quy tắc, câu móc lên đầu, logo xuống cuối. Đó là bước 4 và bước 5 trong bài, áp đều cho mọi video.\n\n▸ KHÔNG CÓ THỜI GIAN DỰNG?\n\nAnh chị cứ quay theo danh sách cảnh, phần dựng có thể giao đi. Edit video tại Dream Labs từ 800.000đ mỗi video (chưa gồm VAT). Gửi thử một đoạn qua Zalo 0934 246 420 hoặc đặt tư vấn 30 phút miễn phí.","media":["media/p12/video.mp4"],"media_phu":["media/p12/slide-1.jpg","media/p12/slide-2.jpg","media/p12/slide-3.jpg","media/p12/slide-4.jpg","media/p12/slide-5.jpg","media/p12/slide-6.jpg","media/p12/slide-7.jpg","media/p12/slide-8.jpg","media/p12/slide-9.jpg","media/p12/slide-10.jpg","media/p12/slide-11.jpg"]},"instagram":{"caption":"Video ngắn đứt lịch thường không phải vì thiếu ý tưởng, mà vì mỗi video đều được làm như lần đầu tiên.\n\nBiến nó thành dây chuyền nhỏ, 6 bước:\n1. Kho chủ đề 4 nhóm: hỏi đáp, hậu trường, mẹo, trước/sau\n2. Kịch bản 3 phần: móc 3 giây, thân 2–4 ý, kết một lời kêu gọi\n3. Quay theo danh sách cảnh, mỗi cảnh 2 lần, dọc 9:16\n4. Một mẫu phụ đề: phông, cỡ, màu, vị trí cố định\n5. Quy tắc màu và chữ thương hiệu trên 1 trang\n6. Lịch đăng cố định với nhịp làm được thật\n\nLướt carousel để xem từng bước và mẫu kịch bản chép dùng được. Mẹo: gom một buổi quay 2–3 video để tiết kiệm công dựng cảnh.\n\nVideo minh họa: trước/sau edit mẫu Lam Kỳ, cảnh 3D dựng bằng code, thương hiệu concept do Dream Labs thiết kế.\n\nKhông có thời gian dựng? Nhắn Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#editvideo","#videongan","#reels","#tiktokvietnam","#kichban","#contentplan","#chuanhoadoanhnghiep","#doanhnghiepnho","#phude","#videomarketing"],"media":["media/p12/slide-1.jpg","media/p12/slide-2.jpg","media/p12/slide-3.jpg","media/p12/slide-4.jpg","media/p12/slide-5.jpg","media/p12/slide-6.jpg","media/p12/slide-7.jpg","media/p12/slide-8.jpg","media/p12/slide-9.jpg","media/p12/slide-10.jpg","media/p12/slide-11.jpg"],"reels":"media/p12/video.mp4"},"tiktok":{"caption":"6 bước để ra video ngắn đều mỗi tuần mà không phải nghĩ lại từ đầu. Lưu lại trước buổi quay tới.","hashtags":["#editvideo","#videongan","#dreamlabs","#contentplan"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"Tuần nào cũng hỏi quay gì?","voice":"Tuần nào cũng ngồi hỏi hôm nay quay gì?"},{"t":"3–7s","screen":"1. Kho chủ đề 4 nhóm","voice":"Lập kho chủ đề: hỏi đáp, hậu trường, mẹo, trước sau."},{"t":"7–12s","screen":"2. Móc · thân · kết","voice":"Kịch bản ba phần: móc ba giây, vài ý chính, một lời kêu gọi."},{"t":"12–16s","screen":"3. Quay theo danh sách cảnh","voice":"Quay theo danh sách cảnh, mỗi cảnh hai lần."},{"t":"16–21s","screen":"4–5. Một mẫu phụ đề, màu","voice":"Một mẫu phụ đề và quy tắc màu chữ cho mọi video."},{"t":"21–25s","screen":"6. Lịch đăng làm được thật","voice":"Chọn nhịp đăng làm được thật và giữ nó."},{"t":"25–30s","screen":"Mẫu concept Lam Kỳ · Dream Labs","voice":"Video trước sau là mẫu Lam Kỳ, thương hiệu concept do Dream Labs thiết kế."}],"media":["media/p12/video.mp4"]},"x":{"tweet":"Video ngắn đều mỗi tuần: kho chủ đề 4 nhóm → kịch bản móc/thân/kết → quay theo danh sách cảnh → một mẫu phụ đề → quy tắc màu chữ 1 trang → lịch đăng làm được thật. Mẫu kịch bản: dreamlabs.vn","thread":["Video ngắn đứt lịch thường vì mỗi video đều làm như lần đầu. 6 bước biến nó thành dây chuyền nhỏ:","1. Kho chủ đề 4 nhóm: hỏi đáp, hậu trường, mẹo, trước/sau. Mỗi nhóm sẵn 5 chủ đề.\n2. Kịch bản 3 phần: móc 0–3s, thân 2–4 ý mỗi ý một cảnh, kết một việc người xem nên làm.","3. Danh sách cảnh: cận, trung, toàn, tay, sản phẩm. Mỗi cảnh quay 2 lần, dọc 9:16.\n4. Một mẫu phụ đề: phông, cỡ, màu, viền, vị trí cố định, tối đa 2 dòng.","5. Quy tắc 1 trang: màu, phông, vị trí logo, cảnh mở và kết.\n6. Nhịp làm được thật, ví dụ 2 video/tuần: thứ Hai kịch bản, thứ Ba quay, thứ Tư dựng.","Quay được nhưng không có thời gian dựng? Tư vấn 30 phút miễn phí: Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p12/video.mp4"]},"zalo_oa":{"tieu_de":"6 bước ra video ngắn đều mỗi tuần","noi_dung":"Kho chủ đề 4 nhóm, kịch bản 3 phần, quay theo danh sách cảnh, một mẫu phụ đề, quy tắc màu chữ thương hiệu và lịch đăng cố định. Dream Labs gửi anh chị mẫu kịch bản và danh sách cảnh để dùng ngay buổi quay tới. Nếu không có thời gian dựng, gửi thử một đoạn để được tư vấn 30 phút miễn phí.","nut":{"nhan":"Xem edit video","link":"https://dreamlabs.vn/edit-video/"},"anh":"media/p12/cover.jpg"},"ghi_chu":"Nhạc: chọn khi duyệt bài. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":13,"ngay":"2026-12-02","thu":"Thứ Tư","tru_cot":"Chuẩn hóa · Bán hàng","uu_tien_zalo":true,"chuoi":"Chuẩn hóa doanh nghiệp","chu_de":"Chuẩn hóa tiếp nhận yêu cầu báo giá qua tin nhắn: danh sách thông tin cần hỏi, câu hỏi mẫu, bảng giá đã duyệt, báo giá sơ bộ, chuyển người khi ngoài phạm vi","tieu_de":"Khách nhắn “giá sao em?”: quy trình tiếp nhận 5 bước","demo":"Ảnh demo mô phỏng Hải Miên Yachts: AI tách yêu cầu và trả báo giá sơ bộ","loai_media":"carousel","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p13/slide-1.jpg","media/p13/slide-2.jpg","media/p13/slide-3.jpg","media/p13/slide-4.jpg","media/p13/slide-5.jpg","media/p13/slide-6.jpg","media/p13/slide-7.jpg","media/p13/slide-8.jpg","media/p13/slide-9.jpg","media/p13/slide-10.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"“Giá sao em?” Ba chữ, nhưng cần năm thông tin mới trả lời được.\n\nTin nhắn hỏi giá đến thường xuyên và cũng là lúc dễ mất khách. Nhân viên A hỏi ngân sách trước, nhân viên B hỏi số lượng trước, nhân viên C gửi luôn bảng giá chung. Khách phải trả lời đi trả lời lại, hoặc nhận một con số không khớp với nhu cầu thật.\n\nBài này tập trung vào khâu tiếp nhận: từ lúc khách nhắn đến lúc khách nhận báo giá sơ bộ. Chuẩn hóa khâu này bằng một danh sách thông tin, bộ câu hỏi mẫu và bảng giá đã duyệt. Khâu này làm chuẩn rồi thì cũng chính là khâu dễ giao cho trợ lý AI nhất.\n\n▸ 5 BƯỚC TIẾP NHẬN YÊU CẦU BÁO GIÁ\n\n1. Liệt kê thông tin tối thiểu cần có\nViết ra 4–6 thông tin bắt buộc phải có mới báo được giá sơ bộ. Ví dụ: sản phẩm/dịch vụ, số lượng, thời gian cần, địa điểm, ngân sách dự kiến. Thiếu thông tin nào thì không được đoán, phải hỏi.\nCông cụ gợi ý: Tài liệu văn bản, nhóm chat nội bộ.\nMẫu chép dùng: Bắt buộc: ☐ Sản phẩm/dịch vụ ☐ Số lượng ☐ Thời gian ☐ Địa điểm · Nên có: ☐ Ngân sách ☐ Yêu cầu đặc biệt\n\n2. Soạn bộ câu hỏi mẫu, gom 1–2 tin\nGom các câu hỏi vào 1–2 tin nhắn có đánh số, khách trả lời một lần. Câu đầu luôn cảm ơn và hẹn thời gian có báo giá. Hỏi gộp có đánh số giúp khách trả lời nhanh hơn hỏi từng câu.\nCông cụ gợi ý: Câu trả lời nhanh trên Zalo OA/Messenger.\nMẫu chép dùng: Dạ cảm ơn anh/chị! Để báo giá sát nhất, anh/chị cho em xin: 1) … 2) Số lượng … 3) Cần khi nào … 4) Ở đâu … Em gửi giá trong … ạ.\n\n3. Tra bảng giá đã duyệt\nNhân viên chỉ báo giá theo bảng đã được chủ doanh nghiệp duyệt, có ngày cập nhật. Không có trong bảng thì không tự báo. Bảng giá có ngày cập nhật giúp tránh báo nhầm giá cũ.\nCông cụ gợi ý: Google Sheets dùng chung, quyền xem cho nhân viên.\nMẫu chép dùng: Mục | Điều kiện | Đơn giá | Ghi chú · Cập nhật ngày: … · Người duyệt: … · (ghi rõ đã/chưa gồm VAT)\n\n4. Gửi báo giá sơ bộ theo mẫu\nBáo giá sơ bộ ngắn trong tin nhắn: tóm lại nhu cầu, khoảng giá, những gì bao gồm, việc tiếp theo. Ghi rõ đây là sơ bộ, chính thức gửi sau. Nhắc lại nhu cầu của khách giúp phát hiện hiểu lầm sớm.\nCông cụ gợi ý: Câu trả lời nhanh, bảng theo dõi khách.\nMẫu chép dùng: Em tóm lại: [nhu cầu]. Giá sơ bộ: từ … đến …đ (chưa gồm VAT), gồm … Bước tiếp: em gửi báo giá chính thức trong … / gọi 5 phút?\n\n5. Chuyển người khi ngoài phạm vi\nViết rõ trường hợp phải chuyển cho người có thẩm quyền: đơn lớn, yêu cầu ngoài bảng giá, khách khiếu nại, xin giảm giá. Ghi ai nhận và trong bao lâu. Quy tắc chuyển người rõ ràng là điều kiện bắt buộc trước khi giao khâu này cho AI.\nCông cụ gợi ý: Nhóm chat nội bộ, bảng phân công.\nMẫu chép dùng: Chuyển khi: ☐ Giá trị > … ☐ Ngoài bảng giá ☐ Xin giảm giá ☐ Khiếu nại → Người nhận: … · Phản hồi khách trong: …\n\n▸ CHECKLIST KHÂU TIẾP NHẬN\n\n☐ Danh sách thông tin bắt buộc đã thống nhất\n☐ Bộ câu hỏi mẫu lưu trong câu trả lời nhanh\n☐ Bảng giá đã duyệt, có ngày cập nhật\n☐ Mẫu báo giá sơ bộ ghi rõ “sơ bộ” và VAT\n☐ Quy tắc chuyển người có tên người nhận\n☐ Mọi yêu cầu được ghi vào bảng theo dõi khách\n\n▸ LỖI HAY GẶP\n\n✕ Gửi ngay bảng giá chung khi chưa biết khách cần gì. Hỏi đủ thông tin tối thiểu trước.\n✕ Hỏi từng câu một, mỗi câu cách nhau vài giờ. Gom câu hỏi đánh số trong 1–2 tin.\n✕ Nhân viên tự giảm giá khi khách hỏi, không qua người duyệt. Đưa “xin giảm giá” vào danh sách chuyển người.\n\n▸ KHI KHÂU TIẾP NHẬN ĐÃ CHUẨN\n\nẢnh trong bài là demo mô phỏng Hải Miên Yachts, một thương hiệu du thuyền concept do Dream Labs dựng, số liệu minh họa. Khách nhắn một câu dài lộn xộn, trợ lý AI tách ra ngày, số khách, tuyến, hỏi thêm đúng thông tin còn thiếu, tra bảng giá đã duyệt và trả báo giá sơ bộ. Yêu cầu ngoài bảng thì chuyển cho người, đúng quy tắc bước 5.\n\n▸ MUỐN TRỢ LÝ AI TIẾP NHẬN GIÚP?\n\nHoàn thành 5 bước trên bằng tay trước. Khi đã có danh sách thông tin, câu hỏi mẫu và bảng giá, gói Khởi động 5.000.000đ (chưa gồm VAT, 5–7 ngày) có trợ lý AI trên Zalo OA/Messenger và đồng bộ Google Sheets. Zalo 0934 246 420 để tư vấn 30 phút miễn phí.","media":["media/p13/slide-1.jpg","media/p13/slide-2.jpg","media/p13/slide-3.jpg","media/p13/slide-4.jpg","media/p13/slide-5.jpg","media/p13/slide-6.jpg","media/p13/slide-7.jpg","media/p13/slide-8.jpg","media/p13/slide-9.jpg","media/p13/slide-10.jpg"],"media_phu":[]},"instagram":{"caption":"“Giá sao em?” Ba chữ, nhưng cần năm thông tin mới trả lời được.\n\nChuẩn hóa khâu tiếp nhận yêu cầu báo giá qua tin nhắn:\n1. Liệt kê 4–6 thông tin tối thiểu cần có\n2. Gom câu hỏi vào 1–2 tin nhắn có đánh số\n3. Chỉ báo theo bảng giá đã duyệt, có ngày cập nhật\n4. Gửi báo giá sơ bộ theo mẫu, ghi rõ “sơ bộ” và VAT\n5. Quy tắc chuyển người: đơn lớn, ngoài bảng giá, xin giảm giá, khiếu nại\n\nLướt carousel để xem từng bước, kèm tin nhắn mẫu chép vào câu trả lời nhanh dùng ngay hôm nay.\n\nẢnh minh họa là demo mô phỏng Hải Miên Yachts, thương hiệu concept do Dream Labs dựng: AI tách yêu cầu của khách và trả báo giá sơ bộ, số liệu minh họa.\n\nMuốn trợ lý AI tiếp nhận giúp? Nhắn Zalo 0934 246 420. Link ở bio","hashtags":["#dreamlabs","#baogia","#zalooa","#messenger","#trolyai","#tudonghoa","#chamsockhachhang","#chuanhoadoanhnghiep","#doanhnghiepnho","#banhangonline"],"media":["media/p13/slide-1.jpg","media/p13/slide-2.jpg","media/p13/slide-3.jpg","media/p13/slide-4.jpg","media/p13/slide-5.jpg","media/p13/slide-6.jpg","media/p13/slide-7.jpg","media/p13/slide-8.jpg","media/p13/slide-9.jpg","media/p13/slide-10.jpg"],"reels":null},"tiktok":{"caption":"Khách nhắn “giá sao em?” thì hỏi gì trước? Quy trình tiếp nhận 5 bước kèm tin nhắn mẫu.","hashtags":["#baogia","#zalooa","#dreamlabs","#banhangonline"],"dang":"photo","kich_ban":[{"t":"0–3s","screen":"Giá sao em?","voice":"Khách nhắn giá sao em, bạn trả lời thế nào?"},{"t":"3–8s","screen":"1. Thông tin tối thiểu","voice":"Viết ra bốn đến sáu thông tin bắt buộc phải có."},{"t":"8–13s","screen":"2. Hỏi gộp, có đánh số","voice":"Gom câu hỏi vào một tin nhắn có đánh số."},{"t":"13–17s","screen":"3. Bảng giá đã duyệt","voice":"Chỉ báo theo bảng giá đã duyệt."},{"t":"17–22s","screen":"4. Báo giá sơ bộ theo mẫu","voice":"Gửi báo giá sơ bộ, nhắc lại nhu cầu của khách."},{"t":"22–26s","screen":"5. Ngoài phạm vi thì chuyển người","voice":"Ngoài bảng giá hay xin giảm giá thì chuyển người."},{"t":"26–30s","screen":"Demo mô phỏng · số liệu minh họa","voice":"Ảnh là demo mô phỏng AI trả báo giá sơ bộ, số liệu minh họa."}],"media":["media/p13/slide-1.jpg","media/p13/slide-2.jpg","media/p13/slide-3.jpg","media/p13/slide-4.jpg","media/p13/slide-5.jpg","media/p13/slide-6.jpg","media/p13/slide-7.jpg","media/p13/slide-8.jpg","media/p13/slide-9.jpg","media/p13/slide-10.jpg"]},"x":{"tweet":"Khách nhắn “giá sao em?”: có danh sách 4–6 thông tin tối thiểu → hỏi gộp 1 tin có đánh số → tra bảng giá đã duyệt → báo giá sơ bộ theo mẫu → ngoài phạm vi thì chuyển người. Tin mẫu: dreamlabs.vn","thread":["“Giá sao em?” Ba chữ, nhưng cần năm thông tin mới trả lời được. Quy trình tiếp nhận 5 bước:","1. Viết ra 4–6 thông tin bắt buộc: sản phẩm, số lượng, thời gian, địa điểm, ngân sách.\n2. Hỏi gộp: “Để báo giá sát nhất, anh/chị cho em xin: 1) … 2) … 3) …”, kèm hẹn giờ có giá.","3. Chỉ báo theo bảng giá đã duyệt, có ngày cập nhật.\n4. Báo giá sơ bộ: tóm lại nhu cầu, khoảng giá (chưa gồm VAT), gồm những gì, bước tiếp theo.","5. Chuyển người khi: đơn lớn, ngoài bảng giá, xin giảm giá, khiếu nại. Ghi rõ ai nhận, trả lời trong bao lâu.","Khâu này chuẩn rồi là khâu dễ giao cho trợ lý AI nhất. Tư vấn 30 phút miễn phí: Zalo 0934 246 420 · dreamlabs.vn"],"tai_khoan":"@dreamlabsvn","media":["media/p13/slide-1.jpg","media/p13/slide-2.jpg","media/p13/slide-3.jpg","media/p13/slide-4.jpg"]},"zalo_oa":{"tieu_de":"Khách hỏi giá: quy trình tiếp nhận 5 bước","noi_dung":"Danh sách thông tin tối thiểu, câu hỏi gộp có đánh số, bảng giá đã duyệt, mẫu báo giá sơ bộ và quy tắc chuyển người khi ngoài phạm vi. Dream Labs gửi anh chị tin nhắn mẫu để chép vào câu trả lời nhanh trên Zalo OA. Khi khâu này đã chuẩn, trợ lý AI có thể tiếp nhận giúp, kể cả ngoài giờ.","nut":{"nhan":"Xem tự động hóa","link":"https://dreamlabs.vn/tu-dong-hoa-quy-trinh-doanh-nghiep/"},"anh":"media/p13/slide-1.jpg"},"ghi_chu":""},{"stt":14,"ngay":"2026-12-03","thu":"Thứ Năm","tru_cot":"Mẫu thiết kế","giai_doan":"Tin","chu_de":"4 phim motion graphic ngắn Dream Labs dựng hoàn toàn bằng code: logo animation, ra mắt sản phẩm, kinetic typography (mẫu concept)","loai_media":"video","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"video":"media/p14/video.mp4","anh_bia":"media/p14/cover.jpg","ghi_chu":"9:16, 1080×1920, H.264; dùng cho TikTok, Reels Facebook/Instagram; ảnh bìa 4:5 làm thumbnail hoặc đăng kèm"},"facebook":{"noi_dung":"4 phim quảng cáo này không dùng một khung hình quay thật nào.\n\nKhông đoàn quay, không thuê địa điểm, không đèn. Từng chuyển động, từng con chữ đều được Dream Labs dựng hoàn toàn bằng code.\n\nĐây là 4 mẫu concept chúng tôi tự thiết kế, thương hiệu đặt ra để minh họa:\n\n– Talvère: phim ra mắt túi xách, cắt sẵn cho Reels và TikTok\n– Calvente: kinetic typography cho giày thủ công, chữ chuyển động theo nhịp\n– Maison Orvèle: quảng cáo nước hoa gói gọn trong 8 giây\n– Valmère: logo animation 7 giây, dùng mở đầu hoặc kết video\n\nMotion graphic hợp với lúc bạn cần giới thiệu sản phẩm, ra mắt bộ sưu tập hay làm logo động, mà chưa muốn tổ chức một buổi quay.\n\nHai gói để bạn dễ chọn (chưa gồm VAT):\n→ Motion Cơ bản 3.000.000đ: logo animation hoặc phim đến 15 giây\n→ Motion Chuyên nghiệp 7.000.000đ: phim đến 60 giây\n\nXem cả 4 phim mẫu tại dreamlabs.vn hoặc nhắn Zalo 0934 246 420 kể về sản phẩm bạn muốn giới thiệu.","media":["media/p14/video.mp4"]},"instagram":{"caption":"4 phim, không một cảnh quay thật. Tất cả dựng bằng code.\n\nTalvère · ra mắt túi xách\nCalvente · kinetic typography cho giày thủ công\nMaison Orvèle · nước hoa, 8 giây\nValmère · logo animation, 7 giây\n\nĐều là mẫu concept do Dream Labs thiết kế.\n\nMotion Cơ bản 3.000.000đ (logo hoặc ≤ 15s)\nMotion Chuyên nghiệp 7.000.000đ (≤ 60s)\nChưa gồm VAT.\n\nLink ở bio","hashtags":["#motiongraphic","#logoanimation","#kinetictypography","#videoquangcao","#thietkedohoa","#rammatsanpham","#motiondesign","#productlaunch","#reels","#branding","#dreamlabs"],"media":["media/p14/video.mp4"]},"tiktok":{"caption":"4 phim quảng cáo không có cảnh quay thật nào, dựng hoàn toàn bằng code. Đều là mẫu concept của Dream Labs.","hashtags":["#motiongraphic","#logoanimation","#kinetictypography","#motiondesign"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"Không có cảnh quay nào là thật","voice":"Bốn phim này không có một cảnh quay thật nào."},{"t":"3–9s","screen":"Talvère · phim ra mắt túi","voice":"Talvère, phim ra mắt túi xách cho Reels và TikTok."},{"t":"9–15s","screen":"Calvente · kinetic typography","voice":"Calvente, chữ chuyển động cho giày thủ công."},{"t":"15–23s","screen":"Maison Orvèle · nước hoa 8 giây","voice":"Maison Orvèle, quảng cáo nước hoa trong tám giây."},{"t":"23–30s","screen":"Valmère · logo animation 7 giây","voice":"Valmère, logo động bảy giây."},{"t":"30–34s","screen":"Mẫu concept · từ 3.000.000đ","voice":"Đều là mẫu concept Dream Labs dựng bằng code, gói từ ba triệu."}],"media":["media/p14/video.mp4"]},"zalo_oa":{"tieu_de":"4 phim motion graphic dựng hoàn toàn bằng code","noi_dung":"Phim ra mắt túi Talvère, kinetic typography Calvente, quảng cáo nước hoa Maison Orvèle 8 giây và logo animation Valmère 7 giây. Đây là các mẫu concept do Dream Labs tự thiết kế. Gói Motion Cơ bản 3.000.000đ cho logo hoặc phim đến 15 giây, Chuyên nghiệp 7.000.000đ cho phim đến 60 giây (chưa gồm VAT).","nut":{"nhan":"Xem phim mẫu","link":"https://dreamlabs.vn/video-motion-graphic/"},"anh":"media/p14/cover.jpg"},"ghi_chu":"Mỗi cảnh có tên mẫu; thẻ kết ghi “thương hiệu trong video là concept”. Video để không tiếng (có kênh âm thanh rỗng). Khi đăng, chọn nhạc trong thư viện nhạc thương mại của TikTok (Commercial Music Library) hoặc thư viện âm thanh Instagram/Facebook cho tài khoản doanh nghiệp."},{"stt":15,"ngay":"2026-12-04","thu":"Thứ Sáu","tru_cot":"Tự động hóa AI","giai_doan":"Tin","chu_de":"AI có thay nhân viên chăm sóc khách hàng không? 4 hiểu lầm thường gặp","loai_media":"carousel","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p15/slide-1.jpg","media/p15/slide-2.jpg","media/p15/slide-3.jpg","media/p15/slide-4.jpg","media/p15/slide-5.jpg","media/p15/slide-6.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"AI vào làm, nhân viên chăm sóc khách hàng có mất việc không?\n\nĐây là câu Dream Labs hay được hỏi. Câu trả lời ngắn: không nên đặt mục tiêu thay thế. Còn đây là 4 hiểu lầm hay gặp.\n\n1. “AI sẽ thay hết nhân viên”\nThực tế: AI làm phần lặp lại và trực ngoài giờ. Người vẫn lo tư vấn sâu, xử lý khiếu nại, chốt đơn lớn.\n\n2. “Phải đổi hết phần mềm đang dùng”\nThường là không. Chúng tôi nối vào công cụ bạn đang có: Zalo OA, Messenger, Google Sheets, CRM.\n\n3. “AI trả lời bừa thì sao?”\nAI chỉ trả lời trong phạm vi tài liệu bạn đã duyệt. Câu khó, khiếu nại, giá đặc biệt thì chuyển sang người thật theo quy tắc cài sẵn.\n\n4. “Chỉ doanh nghiệp lớn mới làm được”\nBắt đầu nhỏ từ 1 quy trình là đủ. Gói Khởi động mất 5–7 ngày, 5.000.000đ (chưa gồm VAT).\n\nNhân viên của bạn không biến mất. Họ chỉ bớt phải gõ lại cùng một câu trả lời nhiều lần mỗi ngày.\n\nCòn băn khoăn nào khác? Nhắn Zalo 0934 246 420, chúng tôi trả lời thẳng.","media":["media/p15/slide-1.jpg","media/p15/slide-2.jpg","media/p15/slide-3.jpg","media/p15/slide-4.jpg","media/p15/slide-5.jpg","media/p15/slide-6.jpg"]},"instagram":{"caption":"AI có thay nhân viên chăm sóc khách hàng không?\n\n4 hiểu lầm hay gặp:\n✕ AI thay hết người → AI làm phần lặp lại, người lo tư vấn sâu và chốt đơn lớn\n✕ Phải đổi phần mềm → Thường không, nối công cụ đang dùng\n✕ AI trả lời bừa → Chỉ trả lời theo tài liệu đã duyệt, câu khó chuyển người thật\n✕ Chỉ doanh nghiệp lớn → Bắt đầu từ 1 quy trình, 5–7 ngày\n\nNhắn Zalo 0934 246 420","hashtags":["#tudonghoa","#chamsockhachhang","#AIchodoanhnghiep","#chatbotzalo","#doanhnghiepnho","#customerservice","#AIautomation","#chatbot","#customerexperience","#smallbusiness","#dreamlabs"],"media":["media/p15/slide-1.jpg","media/p15/slide-2.jpg","media/p15/slide-3.jpg","media/p15/slide-4.jpg","media/p15/slide-5.jpg","media/p15/slide-6.jpg"]},"tiktok":{"caption":"AI có thay nhân viên chăm sóc khách hàng không? 4 hiểu lầm chủ doanh nghiệp hay gặp.","hashtags":["#AIchodoanhnghiep","#chamsockhachhang","#tudonghoa","#chatbotzalo"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"AI có thay nhân viên của bạn?","voice":"Dùng AI thì nhân viên chăm sóc khách có mất việc không?"},{"t":"3–9s","screen":"Hiểu lầm 1: AI thay hết người","voice":"Không, AI làm phần lặp lại và trực ngoài giờ, người lo tư vấn sâu và chốt đơn lớn."},{"t":"9–14s","screen":"Hiểu lầm 2: phải đổi phần mềm","voice":"Thường không cần, mình nối vào công cụ bạn đang dùng."},{"t":"14–20s","screen":"Hiểu lầm 3: AI trả lời bừa","voice":"AI chỉ trả lời theo tài liệu đã duyệt, câu khó thì chuyển người thật."},{"t":"20–25s","screen":"Hiểu lầm 4: chỉ công ty lớn","voice":"Bắt đầu nhỏ từ một quy trình, khoảng năm đến bảy ngày."},{"t":"25–29s","screen":"Zalo c khi in, bạn đã có mockup 3D để chụp ảnh quảng cáo, đăng bán thử. Trong video, túi da Tịnh Vân xoay 360 độ là ví dụ cho kiểu mockup này (cũng là mẫu concept).\n\nGói Thiết kế sản phẩm Chuyên nghiệp 5.000.000đ (chưa gồm VAT):\n→ Bộ bao bì đến 3 kích thước\n→ 3 phương án để chọn\n→ Hỗ trợ làm việc với nhà in\n\nSản phẩm tốt xứng đáng được nhìn thấy. Nhắn Zalo 0934 246 420 hoặc xem thêm tại dreamlabs.vn.","media":["media/p16/video.mp4"]},"instagram":{"caption":"Trước: túi kraft, nhãn “cà phê rang xay”, lẫn vào kệ.\nSau: nền đen, nhãn số mẻ rang, chữ đậm, mỗi dòng một màu.\n\nGác Khói Roastery là mẫu concept do Dream Labs thiết kế. Có mockup 3D để chụp quảng cáo trước khi in.\n\nThiết kế sản phẩm Chuyên nghiệp 5.000.000đ: bao bì đến 3 kích thước, 3 phương án, hỗ trợ làm việc với nhà in (chưa gồm VAT).\n\nLink ở bio","hashtags":["#thietkebaobi","#baobicaphe","#caphe","#rangxay","#nhanhieu","#packagingdesign","#coffeepackaging","#specialtycoffee","#mockup3d","#branding","#beforeandafter","#dreamlabs"],"media":["media/p16/video.mp4"]},"tiktok":{"caption":"Từ túi kraft dán nhãn chung chung thành bộ bao bì cà phê có nhận diện. Gác Khói là mẫu concept của Dream Labs.","hashtags":["#thietkebaobi","#packagingdesign","#caphe","#beforeandafter"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"Túi cà phê của bạn có lẫn vào kệ?","voice":"Túi cà phê của bạn có đang lẫn giữa kệ hàng không?"},{"t":"3–6s","screen":"Trước: nhãn “cà phê rang xay”","voice":"Trước, chỉ là túi kraft với một nhãn chung chung."},{"t":"6–11s","screen":"Sau: nền đen · số mẻ rang · chữ đậm","voice":"Sau, bao bì đen, nhãn ghi số mẻ rang, chữ đậm dễ đọc."},{"t":"11–16s","screen":"3 dòng · 3 màu","voice":"Mỗi dòng cà phê một màu riêng."},{"t":"16–22s","screen":"Mockup 3D trước khi in","voice":"Có mockup 3D xoay ba trăm sáu mươi độ để chụp quảng cáo trước khi in."},{"t":"22–27s","screen":"Mẫu concept · 5.000.000đ · Zalo 0934 246 420","voice":"Gác Khói là mẫu concept, gói Chuyên nghiệp năm triệu, nhắn Zalo nhé."}], idences, dự án căn hộ concept do chúng tôi tự đặt ra, để minh họa cách chấm điểm tự động:\n\n→ Gom khách từ form, Zalo, hotline về một chỗ\n→ AI đọc nội dung từng khách và chấm mức độ quan tâm: có nói ngân sách không, định mua khi nào, hỏi có cụ thể không\n→ Tự đẩy vào CRM, gắn người phụ trách\n→ Sáng ra, mỗi sale có danh sách gọi theo thứ tự ưu tiên\n\nKhách hỏi “căn 2 phòng ngủ tầng trung, thanh toán theo tiến độ thế nào” sẽ được gọi trước khách chỉ nhắn “giá bao nhiêu”.\n\nĐây là demo mô phỏng, số liệu minh họa. Tiêu chí chấm điểm thật sẽ do chính đội sale của bạn đặt ra.\n\nMuốn xem demo chạy? Nhắn Zalo 0934 246 420 hoặc xem thêm tại dreamlabs.vn.","media":["media/p18/slide-1.jpg","media/p18/slide-2.jpg","media/p18/slide-3.jpg","media/p18/slide-4.jpg","media/p18/slide-5.jpg"]},"instagram":{"caption":"Khách đến từ form, Zalo, hotline.\nAI đọc từng người, chấm mức độ quan tâm theo ngân sách, thời gian và câu hỏi cụ thể.\nTự đẩy vào CRM, gắn người phụ trách.\n\nSáng ra, sale có danh sách gọi theo thứ tự ưu tiên. Khách nóng được gọi trước.\n\nDemo mô phỏng với Vọng Nguyệt Residences, dự án concept do Dream Labs đặt ra. Số liệu minh họa.\n\nLink ở bio","hashtags":["#batdongsan","#tudonghoa","#chamdiemkhachhang","#CRM","#AIchodoanhnghiep","#doisale","#leadscoring","#salesautomation","#realestate","#AIautomation","#dreamlabs"],"media":["media/p18/slide-1.jpg","media/p18/slide-2.jpg","media/p18/slide-3.jpg","media/p18/slide-4.jpg","media/p18/slide-5.jpg"]},"tiktok":{"caption":"Sale gọi khách nóng trước nhờ AI chấm điểm khách tiềm năng. Demo mô phỏng, số liệu minh họa.","hashtags":["#batdongsan","#leadscoring","#tudonghoa","#CRM"],"dang":"photo","kich_ban":[{"t":"0–3s","screen":"Sáng nay gọi khách nào trước?","voice":"Một danh sách dài khách mới, sale nên gọi ai trước?"},{"t":"3–7s","screen":"Form · Zalo · Hotline → 1 chỗ","voice":"Khách từ form, Zalo và hotline được gom về một chỗ."},{"t":"7–12s","screen":"AI chấm: ngân sách · thời gian · câu hỏi","voice":"AI đọc nội du ],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"15 phút mỗi ngày nghe chẳng đáng gì. Thử nhân lên xem.\n\nViệc làm tay có một chi phí ít ai ghi vào sổ: thời gian. Không ai thấy nó trong báo cáo, nhưng nó trôi đi mỗi ngày.\n\nCông thức rất đơn giản:\nPhút mỗi ngày × số ngày làm việc ÷ 60 = số giờ.\n\nVí dụ phép tính (chỉ để minh họa, không phải số liệu của khách nào):\n– Một việc mất 15 phút mỗi ngày\n– 15 × 26 ngày = 390 phút ≈ 6,5 giờ mỗi tháng\n– Cả năm: khoảng 78 giờ\n\nĐó mới là một việc, của một người.\n\nGiờ đến lượt bạn:\n→ Liệt kê các việc lặp lại: chép đơn, trả lời giá, làm báo cáo cuối ngày...\n→ Ghi số phút mỗi việc, nhân với số người đang làm.\n→ Cộng lại, rồi đặt cạnh chi phí triển khai một lần.\n\nCó thể kết quả cho thấy chưa cần tự động hóa. Cũng có thể bạn bất ngờ. Dù thế nào, đó là con số của chính doanh nghiệp bạn, không phải lời quảng cáo.\n\nTính xong, chụp màn hình gửi Dream Labs qua Zalo 0934 246 420. Chúng tôi cùng bạn xem việc nào đáng làm trước. Hoặc tham khảo thêm tại dreamlabs.vn.","media":["media/p27/slide-1.jpg","media/p27/slide-2.jpg","media/p27/slide-3.jpg","media/p27/slide-4.jpg","media/p27/slide-5.jpg"]},"instagram":{"caption":"Ví dụ: 15 phút/ngày × 26 ngày = 6,5 giờ/tháng ≈ 78 giờ/năm.\nMột việc. Một người.\n\nĐây chỉ là phép tính minh họa. Bây giờ thử điền số của bạn: mỗi việc lặp lại mất bao nhiêu phút, bao nhiêu người làm. Cộng lại rồi so với chi phí triển khai một lần.\n\nTính xong gửi Dream Labs để cùng xem.\n\nNhắn Zalo 0934 246 420","hashtags":["#chiphian","#tudonghoa","#quanlythoigian","#doanhnghiepnho","#vanhanh","#timeismoney","#productivity","#AIautomation","#businessowner","#workflow"],"media":["media/p27/slide-1.jpg","media/p27/slide-2.jpg","media/p27/slide-3.jpg","media/p27/slide-4.jpg","media/p27/slide-5.jpg"]},"tiktok":{"caption":"15 phút mỗi ngày là bao nhiêu giờ mỗi năm? Ví dụ minh họa, giờ thử điền số của chính bạn.","hashtags":["#tudonghoa","#chiphian","#doanhnghiepnho","#productivity"],"dang":"video","kich_ban":[{"t":"0–3s","screen":"15 phút/ngày = ? giờ/năm","voice":"Mười lăm phút mỗi ngày, cả năm là bao nhiêu giờ?"},{"t":"3–8s","screen":"Phút × ngày làm việc ÷ 60","voice":"Công thức: số phút nhân số ngày làm việc, chia sáu mươi."},{"t":"8–14s","screen":"Ví dụ: 15 × 26 = 6,5 giờ/tháng","voice":"Ví dụ mười lăm phút nhân hai mươi sáu ngày, ra sáu tiếng rưỡi mỗi tháng."},{"t":"14–19s","screen":"≈ 78 giờ/năm · 1 việc, 1 người","voice":"Tức khoảng bảy mươi tám giờ một năm, cho một việc của một người."},{"t":"19–25s","screen":"Điền số của bạn","voice":"Giờ bạn thử điền số việc và số người của mình vào xem."},{"t":"25–30s","screen":"Gửi kết quả: Zalo 0934 246 420","voice":"Tính xong gửi Dream Labs, mình cùng xem việc nào đáng làm trước."}],"media":["media/p27/slide-1.jpg","media/p27/slide-2.jpg","media/p27/slide-3.jpg","media/p27/slide-4.jpg","media/p27/slide-5.jpg"]},"zalo_oa":{"tieu_de":"Tự tính: việc làm tay đang tốn bao nhiêu giờ mỗi năm?","noi_dung":"Công thức: phút mỗi ngày × số ngày làm việc ÷ 60. Ví dụ minh họa: 15 phút × 26 ngày ≈ 6,5 giờ/tháng, khoảng 78 giờ/năm cho một việc, một người. Hãy điền số của chính bạn, nhân với số việc và số người, rồi so với chi phí triển khai. Gửi kết quả để Dream Labs cùng xem.","nut":{"nhan":"Gửi số của bạn","link":"https://dreamlabs.vn/#lien-he"},"anh":"media/p27/slide-1.jpg"},"ghi_chu":"Con số 15 phút / 78 giờ là phép tính minh họa, đã ghi rõ là ví dụ trong mọi bản."},{"stt":28,"ngay":"2026-12-17","thu":"Thứ Năm","tru_cot":"Tự động hóa AI","giai_doan":"Liên hệ","chu_de":"5 câu hỏi chủ doanh nghiệp hay hỏi về tự động hóa bằng AI","loai_media":"carousel","gio_dang":{"facebook":"20:00","instagram":"12:00","tiktok":"21:00","zalo_oa":"08:00","mui_gio":"Asia/Ho_Chi_Minh (UTC+7)"},"media":{"carousel":["media/p28/slide-1.jpg","media/p28/slide-2.jpg","media/p28/slide-3.jpg","media/p28/slide-4.jpg","media/p28/slide-5.jpg","media/p28/slide-6.jpg","media/p28/slide-7.jpg"],"ghi_chu":"4:5, 1080×1350; Facebook/Instagram đăng album; TikTok đăng dạng ảnh trượt"},"facebook":{"noi_dung":"5 câu anh chị hay hỏi trước khi làm tự động hóa.\n\n1. Doanh nghiệp nhỏ có nên làm không?\nCó, nếu bắt đầu nhỏ. Chọn đúng 1 quy trình đang ngốn giờ nhất, chạy ổn rồi mới mở rộng.\n\n2. AI có thay được nhân viên không?\nChúng tôi không khuyên đặt mục tiêu thay người. AI làm phần lặp lại: chép dữ liệu, trả lời câu quen, soạn nháp báo cáo. Nhân viên giữ phần cần phán đoán và chăm khách.\n\n3. Mất bao lâu?\n– 1 quy trình: 5–7 ngày\n– 3 quy trình: khoảng 14 ngày\n– AI agent riêng: từ 30 ngày\n\n4. Có phải đổi phần mềm đang dùng?\nThường là không. Dream Labs nối vào những gì anh chị đang có: Zalo OA, Google Sheets, CRM, phần mềm bán hàng.\n\n5. Dữ liệu có an toàn không?\n– Chỉ cấp quyền vừa đủ cho từng bước\n– Lưu nhật ký mọi lần chạy\n– Tài khoản đứng tên doanh nghiệp, không đứng tên chúng tôi\n– Bàn giao sơ đồ luồng để anh chị nắm toàn bộ\n\nCòn câu thứ 6 chưa có ở đây? Bình luận bên dưới hoặc nhắn Zalo 0934 246 420, Dream Labs trả lời thẳng. Xem thêm tại dreamlabs.vn.","media":["media/p28/slide-1.jpg","media/p28/slide-2.jpg","media/p28/slide-3.jpg","media/p28/slide-4.jpg","media/p28/slide-5.jpg","media/p28/slide-6.jpg","media/p28/slide-7.jpg"]},"instagram":{"caption":"5 câu hỏi về tự động hóa bằng AI, trả lời ngắn:\n\n1. Doanh nghiệp nhỏ có nên làm? Có, bắt đầu từ 1 quy trình.\n2. AI thay nhân viên? Không nên đặt mục tiêu đó.\n3. Mất bao lâu? 5–7 ngày cho 1 quy trình.\n4. Phải đổi phần mềm? Thường không.\n5. Dữ liệu an toàn? Quyền vừa đủ, có nhật ký, tài khoản đứng tên doanh nghiệp.\n\nVuốt để xem chi tiết. Link ở bio","hashtags":["#hoidap","#FAQ","#tudonghoa","#trolyai","#doanhnghiepnho","#baomatdulieu","#n8n","#zalooa","#AIautomation","#smallbusiness","#businessautomation"],"media":["media/p28/slide-1.jpg","media/p28/slide-2.jpg","media/p28/slide-3.jpg","media/p28/slide-4.jpg","media/p28/slide-5.jpg","media/p28/slide-6.jpg","media/p28/slide-7.jpg"]},"tiktok":{"caption" const tk=p.tiktok;const tabs={Facebook:'<div class="h">'+p.gio_dang.facebook+' · Facebook Page</div>'+e(p.facebook.noi_dung),Instagram:'<div class="h">'+p.gio_dang.instagram+' · Instagram</div>'+e(p.instagram.caption)+'\n\n'+e(p.instagram.hashtags.join(' ')),TikTok:'<div class="h">'+p.gio_dang.tiktok+' · TikTok ('+(tk.dang==='photo'?'ảnh trượt':'video')+')</div>'+e(tk.caption)+' '+e(tk.hashtags.join(' '))+'<br><small>'+tk.caption.length+'/150 ký tự</small><table>'+tk.kich_ban.map(s=>'<tr><td>'+e(s.t)+'</td><td><b>'+e(s.screen)+'</b><br><small>'+e(s.voice||'')+'</small></td></tr>').join('')+'</table>',X:(p.x?'<div class="h">X · @dreamlabsvn</div>'+e(p.x.tweet)+'<br><small>'+p.x.tweet.length+'/280 ký tự</small>'+(p.x.thread.length?'<table>'+p.x.thread.map((s,i)=>'<tr><td>'+(i+1)+'/'+p.x.thread.length+'</td><td>'+e(s)+'<br><small>'+s.length+'/280</small></td></tr>').join('')+'</table>':''):'<small>Chưa có bản X</small>'),'Zalo OA':'<div class="h">'+p.gio_dang.zalo_oa+' · Zalo OA</div><b>'+e(p.zalo_oa.tieu_de)+'</b>\n'+e(p.zalo_oa.noi_dung)+'\n\n[ '+e(p.zalo_oa.nut.nhan)+' ] → '+e(p.zalo_oa.nut.link)};
const ks=Object.keys(tabs);
L.insertAdjacentHTML('beforeend','<article class="post" id="b'+p.stt+'"><div class="media">'+med+'</div><div><div class="meta"><b>#'+p.stt+'</b><span>'+p.thu+', '+p.ngay.split('-').reverse().join('/')+'</span><span class="badge" style="background:'+COLF(p.tru_cot)+'">'+e(p.tru_cot)+'</span>'+(p.chuoi?'<span>Chuỗi: '+e(p.chuoi)+'</span>':'')+'</div><h2>'+e(p.tieu_de||p.chu_de)+'</h2><div class="tabs" role="tablist">'+ks.map((k,i)=>'<button role="tab" aria-selected="'+(i?'false':'true')+'" data-k="'+i+'">'+k+'</button>').join('')+'</div>'+ks.map((k,i)=>'<div class="pane" '+(i?'hidden':'')+'>'+tabs[k]+'</div>').join('')+(p.ghi_chu?'<div class="note">'+e(p.ghi_chu)+'</div>':'')+'</div></article>')});
L.addEventListener('click',ev=>{const b=ev.target.closest('.tabs button');if(!b)return;const art=b.closest('article');art.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));art.querySelectorAll('.pane').forEach((x,i)=>x.hidden=i!=b.dataset.k)});
</script></body></html>
